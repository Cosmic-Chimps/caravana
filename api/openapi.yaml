openapi: 3.1.0
info:
  title: Caravana API
  version: 0.9.1
  summary: Self-hosted PaaS on HashiCorp Nomad.
  description: |
    Every endpoint lives under `/v1`. Request bodies are `application/json`, with or without
    parameters such as `charset=UTF-8`. Unknown body fields are rejected.

    Every error is `{"error": {"code", "message", "field"}}` with the matching 4xx or 5xx
    status, including 404 for unknown paths and 405 for wrong methods. The API never answers
    a request with a redirect. An error raised after a deployment record exists also carries a
    `Location` header pointing at that record.

    Durations (`health.interval`, `health.timeout`) are Go duration strings such as `"10s"` or
    `"1m30s"`, in requests and responses.

    Secret values (`services[].secrets[].value`) are write-only. They are kept in the cluster's
    secret store, never in an app read back, a deployment or the Nomad job. A store that can't
    be written fails the deploy with 502 `secret_store_unavailable` before Nomad gets the job.

    Every endpoint needs authentication except `GET /v1/health` and `POST /v1/webhooks/{id}`.
    Clients send an API token as `Authorization: Bearer cvat_…`; the admin creates tokens on the
    host (`caravana admin create-token`), on the web account page, or with `createToken`. A
    browser signed in to the web UI may use its session cookie instead; then every
    state-changing request must come from caravana's own pages, or it gets 403
    `cross_origin`. A request without valid credentials gets 401 `unauthorized`, the same for
    every reason (missing, malformed, wrong, expired or revoked token, no admin yet), and is
    never redirected.

    `POST /v1/webhooks/{id}` needs the app's webhook token instead, and is also served, alone,
    on the optional webhook-only listener. Webhook tokens and API tokens never stand in for
    each other.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:7070
    description: Local default
security:
  - apiToken: []
  - session: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report whether the server and its store are up.
      description: Unauthenticated, now and later. Meant for load balancers and install scripts.
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up and its store is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/apps:
    get:
      operationId: listApps
      summary: List every app with its current status, by ID.
      tags: [apps]
      responses:
        "200":
          description: |
            All apps. When Nomad can't be read, each status is `unknown` and the stored
            data is still returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createApp
      summary: Create a new app and start its first deployment.
      description: |
        Like `deployApp` with a body, but never replaces a stored app: an existing ID is
        `409 app_exists` and nothing changes. Follow the rollout at `Location`.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/App"
      responses:
        "202":
          description: Saved; Nomad accepted the job.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          description: |
            `app_exists` (`field: "id"`): an app with this ID is stored. Or `job_conflict`,
            as for `deployApp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/deployments:
    get:
      operationId: listRecentDeployments
      summary: List the newest deployments across all apps.
      tags: [deployments]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: The newest deployments, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getApp
      summary: Read an app as it was last sent.
      tags: [apps]
      responses:
        "200":
          description: The stored app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteApp
      summary: Delete an app for good.
      description: |
        Stops and purges the app's Nomad job, deletes its secrets, then erases the app, its
        deployments and its webhook token. If Nomad can't stop the job or the secrets can't be
        deleted, the app is kept and the call can be made again. Not reversible; the ID can be used for a new app afterwards.
      tags: [apps]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/copies:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listCopies
      summary: List the app's copies (Nomad allocations).
      description: |
        Every copy that hasn't ended, plus the ended copies of the app's latest job version
        that Nomad still keeps. Ordered by service, then job version (newest first), then start
        time.
      tags: [apps]
      responses:
        "200":
          description: The app's copies; empty when it has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getLogs
      summary: Read the app's recent output, or follow it.
      description: |
        Without `follow`, returns up to `lines` recent lines as JSON, oldest first. With
        `follow=true`, answers `text/event-stream`: the same recent lines as `log` events, then
        each new line as it is written, a comment line every 20 seconds while idle, until the
        client disconnects or its credentials end (then an `ended` event, and the stream
        closes). Errors found before the stream starts are JSON as usual. Following doesn't
        renew a browser session.

        Nomad's lines carry no time, so the recent lines are ordered per copy, copies in the
        order they started, each copy's `stdout` before its `stderr`. Followed lines are
        interleaved as they arrive and carry `time`. Output is plain text: show it as text,
        never as markup.
      tags: [apps]
      parameters:
        - name: copy
          in: query
          description: One copy's ID, from `listCopies`. Absent means every listed copy.
          schema:
            type: string
        - name: stream
          in: query
          schema:
            type: string
            enum: [stdout, stderr, both]
            default: both
        - name: lines
          in: query
          description: How many recent lines to start with.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recent output as JSON, or, with `follow=true`, as an event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogLines"
            text/event-stream:
              schema:
                type: string
                description: |
                  `event: log` with `data:` one `LogLine` as JSON; `event: ended` with no data
                  when the stream ends because its credentials ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such app, or `copy` isn't one of its copies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/compose:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: deployCompose
      summary: Save an app from a Compose file and deploy it.
      description: |
        The Compose file is turned into an app (source kind `compose`) and deployed exactly
        like `deployApp` does with a body: saved under this ID, replacing the stored app, and
        rolled out. The file itself isn't stored; redeploys use the stored app.

        Every attribute of the file is honored, honored with a warning in the deployment's
        `warnings`, or refused with 400 naming it in `field` as a path in the file
        (`services.web.build`). `x-` extensions are ignored. Variables (`${NAME}`) take only the
        file's own defaults. What Compose has no words for (public domains, a health check
        Nomad can run, secret values) goes in `services`, next to the file.
      tags: [deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "202":
          description: Nomad accepted the job; follow it like any deployment.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/JobConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/compose/preview:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: previewCompose
      summary: Show the app a Compose file becomes, without saving or deploying it.
      description: |
        Takes the same body as `deployCompose` and answers with the app it would deploy and the
        warnings it would carry. Nothing is saved, deployed or asked of Nomad. Secrets list
        names only.
      tags: [deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "200":
          description: The app and its warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/backups/destination:
    get:
      operationId: getBackupDestination
      summary: Read where backups go, without the secret key.
      tags: [backups]
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDestination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: setBackupDestination
      summary: Set where backups go.
      description: |
        One S3-compatible bucket for the installation. Leave `secretAccessKey` out to keep the
        one set before; it is required the first time and never returned. Every backup
        schedule uses the new destination from its next run, without a deploy.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupDestinationRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDestination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/backups:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listBackups
      summary: List an app's backups still in the destination, and its recent restores.
      tags: [backups]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createBackup
      summary: Back up one service now.
      description: |
        Starts a backup of a service with a backup policy. It runs in the background: list the
        backups to follow it. 409 `backup_running` while a backup or restore of that service
        runs; 409 `no_backup_destination` when none is set.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service]
              properties:
                service: {type: string}
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BackupConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/backups/{backupId}/restore:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: backupId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: restoreBackup
      summary: Load a backup into its running database.
      description: |
        Replaces what the service's database holds with the backup (`pg_restore --clean`).
        Clients connected meanwhile may see errors. It runs in the background: list the backups
        to follow the restore. One restore per service at a time.
      tags: [backups]
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BackupConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/deployments:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: deployApp
      summary: Save an app and deploy it, or redeploy the stored app.
      description: |
        With a body, the app is validated, saved (replacing the stored app with the same ID)
        and deployed. With an empty body, the stored app is deployed again.

        Every image tag is resolved to a digest, the app becomes a new Nomad job version, and
        the response comes back as soon as Nomad has accepted it. Follow the rollout by
        reading the deployment at the `Location` header until its status is final
        (`healthy`, `failed`, `reverted` or `superseded`).

        The same body sent twice leaves the stored app unchanged and creates a new deployment
        and a new job version. When two deploys of one app overlap, the one requested last
        wins and the others end `superseded`.
      tags: [deployments]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/App"
      responses:
        "202":
          description: |
            Nomad accepted the job and the rollout continues in the background. A deploy that
            a newer request replaced before it reached Nomad also answers 202, with status
            `superseded` and no `jobVersion`. Rarely, Nomad has accepted the job but its
            version isn't known yet; `jobVersion` is then absent and appears on the deployment
            shortly after.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: Empty body, and no app with this ID is stored.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/JobConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
    get:
      operationId: listDeployments
      summary: List an app's deployments, newest first.
      tags: [deployments]
      parameters:
        - name: limit
          in: query
          required: false
          description: How many deployments to return, newest first.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The app's newest deployments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getDeployment
      summary: Read one deployment of an app.
      tags: [deployments]
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}/redeploy:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      operationId: redeployDeployment
      summary: Deploy a past healthy version of the app again.
      description: |
        Deploys what that deployment deployed: its app definition, with each service's image
        pinned by the same digest (tags are not resolved again). The definition becomes the
        stored app, and the new deployment's `source` names the one it came from. It is a new
        deployment and a new Nomad job version, followed like any other (see `deployApp`).

        Secret values are not versioned: the version's secrets keep their current values. A
        secret it uses that has no value now is refused (400 `invalid_field` on
        `services[i].secrets[j].value`). Secrets the stored app has and the version doesn't are
        deleted, with a warning each. A later `deployApp` with an empty body, or a webhook,
        resolves the tags again.
      tags: [deployments]
      responses:
        "202":
          description: Nomad accepted the job; the rollout continues in the background.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `deployment_not_healthy`: only a healthy deployment can be redeployed.
            `definition_not_recorded`: the deployment is from before Caravana saved what each
            deployment deployed. `job_conflict`: as for `deployApp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/deployments/{deploymentId}/jobspec:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: exportDeployment
      summary: Export one deployment of the app as a Nomad jobspec.
      description: |
        The Nomad job Caravana registered for that deployment, as HCL, after a comment saying
        what it needs from the cluster (Traefik routing, host volumes, the Nomad Variables
        holding the secrets). It never holds a secret value. `nomad job run` runs it without
        Caravana.
      tags: [deployments]
      responses:
        "200":
          $ref: "#/components/responses/Jobspec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`definition_not_recorded`: the deployment is from before Caravana saved what each deployment deployed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/jobspec:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: exportApp
      summary: Export the app's live version as a Nomad jobspec.
      description: |
        Like `exportDeployment`, for the app's newest healthy deployment.
      tags: [apps]
      responses:
        "200":
          $ref: "#/components/responses/Jobspec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `no_live_deployment`: the app has no healthy deployment yet.
            `definition_not_recorded`: its live deployment is from before Caravana saved what
            each deployment deployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/webhook:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: createWebhookToken
      summary: Create or rotate the app's webhook token.
      description: |
        Returns a new token, shown only in this response; any earlier token of this app stops
        working at once. `path` is the webhook path with the token in its query string, ready to
        append to the public base URL of the webhook listener.
      tags: [webhooks]
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: getWebhook
      summary: Tell whether the app has a webhook token, never the token itself.
      tags: [webhooks]
      responses:
        "200":
          description: The webhook status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteWebhookToken
      summary: Turn the app's webhook off.
      description: Deletes the token, if any. The webhook then refuses every call for this app.
      tags: [webhooks]
      responses:
        "204":
          description: The app has no webhook token now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: callWebhook
      summary: Redeploy the stored app, if its images changed.
      description: |
        Authorized by the app's webhook token, in the `token` query parameter or an
        `Authorization: Bearer` header (both present must be equal). Every image is resolved
        again: when every digest equals the app's latest healthy deployment and the stored app
        hasn't changed since, nothing is deployed (200, `changed: false`). Otherwise the stored
        app is redeployed exactly like an empty-body `deployApp`, with trigger `webhook` (202).

        Any request body is accepted and ignored (up to 1 MiB), whatever its content type.
        Every authorization failure, including an unknown app, gets the same 401.
      tags: [webhooks]
      security:
        - webhookBearer: []
        - webhookQuery: []
      requestBody:
        required: false
        content:
          "*/*":
            schema: {}
      responses:
        "200":
          description: Nothing changed; the app's live (latest healthy) deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "202":
          description: Nomad accepted the redeploy; follow the Location on the main API.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/JobConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/account/password:
    put:
      operationId: changePassword
      summary: Change the admin's password.
      description: |
        Needs the current password. Every session ends except the one making the request, if
        it was made with a session. API tokens keep working. The web account page and
        `caravana admin reset-password` on the host use the same service call.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens:
    post:
      operationId: createToken
      summary: Create an API token.
      description: |
        Returns a new token, shown only in this response. It grants the whole API, as the
        admin, until it is revoked or its `expiresAt` passes. `name` must be unique among the
        tokens that are still active.
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The new token.
          headers:
            Location:
              description: The token's URL, `/v1/tokens/{tokenId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/TokenNameTaken"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listTokens
      summary: List API tokens, never their values.
      description: Every token, newest first, including expired and revoked ones.
      tags: [tokens]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeToken
      summary: Revoke an API token.
      description: |
        The token is refused from now on. It stays in the list as `revoked`. Revoking a token
        that is already revoked changes nothing. A request may revoke the token it is using.
      tags: [tokens]
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    AppID:
      name: id
      in: path
      required: true
      description: The app ID, a lowercase DNS label. It is also the Nomad job ID.
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples:
        whoami:
          value: whoami
    TokenID:
      name: tokenId
      in: path
      required: true
      description: The token's ID, as `listTokens` returns it. Not the token itself.
      schema:
        type: string
        pattern: "^[a-z2-7]{26}$"

  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: "An API token as `Authorization: Bearer cvat_…`."
    session:
      type: apiKey
      in: cookie
      name: caravana_session
      description: |
        The web UI's session, set by signing in at `/login`. Over HTTPS the cookie is named
        `__Host-caravana_session`. State-changing requests must come from caravana's own pages.
    webhookBearer:
      type: http
      scheme: bearer
      description: "The app's webhook token as `Authorization: Bearer cvwh_…`."
    webhookQuery:
      type: apiKey
      in: query
      name: token
      description: "The app's webhook token as `?token=cvwh_…`, for senders that only take a URL."

  headers:
    DeploymentLocation:
      description: The deployment's URL, `/v1/apps/{id}/deployments/{deploymentId}`.
      schema:
        type: string
        examples: ["/v1/apps/whoami/deployments/k3v7q2x9m4n8p6r5t1w3y7z2ab"]

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: |
            The running Caravana's version, e.g. `0.12.0`; `dev` for a build without one. The
            installer waits for it to confirm an upgrade.
          examples: ["0.12.0"]

    App:
      type: object
      additionalProperties: false
      description: |
        One project to deploy. It becomes one Nomad job; each service becomes one task group
        with one task. Images may use tags: they're resolved to digests on every deploy.
      required: [source, services]
      properties:
        id:
          type: string
          description: Optional in a request (taken from the path); if present, must equal it.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          type: string
          description: Display name and Nomad job name. Empty means the ID.
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              enum: [image, compose]
              description: |
                Which input the app came from. `compose` is set by `deployCompose`; both kinds
                deploy the same way.
        services:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Service"
      examples:
        - id: whoami
          source: {kind: image}
          services:
            - name: web
              image: traefik/whoami:latest
              ports: [{name: http, containerPort: 80}]
              domains: [{host: whoami.localhost, port: http}]
              health: {path: /, interval: 10s, timeout: 2s}

    Service:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        image:
          type: string
          description: |
            A Docker Hub or GHCR image: `traefik/whoami:latest`, `nginx`,
            `ghcr.io/owner/repo:tag`, or a reference pinned by digest. No tag means `latest`.
        command:
          type: string
        args:
          type: array
          items: {type: string}
        env:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1}
              value: {type: string}
        secrets:
          type: array
          description: |
            The service's secrets, as environment variables. Each deploy replaces the whole
            list: a name you leave out is removed. Send `value` to set a secret; leave it out to
            keep the value it has now. Values are write-only: responses list names only. An
            app's secrets hold at most 61440 bytes in total.
          items:
            $ref: "#/components/schemas/Secret"
        volumes:
          type: array
          description: |
            Directories that keep their data across deploys, each mounted by this service only.
            A service with a volume runs one copy (`replicas` absent or 1), and its deploys stop
            the old copy before starting the new one. A volume is created on the first deploy
            that names it and deleted with the app.
          items:
            $ref: "#/components/schemas/Volume"
        backup:
          $ref: "#/components/schemas/BackupPolicy"
        ports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, containerPort]
            properties:
              name:
                type: string
                pattern: "^[a-z][a-z0-9_]{0,62}$"
              containerPort:
                type: integer
                minimum: 1
                maximum: 65535
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host, port]
            properties:
              host: {type: string}
              port:
                type: string
                description: The name of a port declared on this service.
        replicas:
          type: integer
          minimum: 1
          description: Leave it out for 1.
        resources:
          type: object
          additionalProperties: false
          properties:
            cpuMHz: {type: integer, minimum: 0}
            memoryMB: {type: integer, minimum: 0}
        health:
          type: object
          additionalProperties: false
          description: Required when the service has ports, not allowed when it has none.
          properties:
            path:
              type: string
              description: Makes it an HTTP check on this path. Empty means a TCP check.
            port:
              type: string
            interval:
              $ref: "#/components/schemas/Duration"
            timeout:
              $ref: "#/components/schemas/Duration"

    Volume:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
          description: Unique across the app.
        path:
          type: string
          description: Where the service sees it. An absolute, clean path, not `/`.
          examples: ["/var/lib/postgresql/data"]
        readOnly:
          type: boolean

    ComposeRequest:
      type: object
      additionalProperties: false
      required: [compose]
      properties:
        compose:
          type: string
          maxLength: 524288
          description: The Compose file, as `docker compose up` would read it.
        name:
          type: string
          description: Display name of the app. Empty means the ID.
        services:
          type: object
          description: What Compose has no words for, per service of the file (by its name).
          additionalProperties:
            $ref: "#/components/schemas/ComposeOverlay"
      examples:
        - compose: |
            services:
              web:
                image: traefik/whoami
                ports: ["80"]
          services:
            web:
              domains: [{host: whoami.localhost}]

    ComposeOverlay:
      type: object
      additionalProperties: false
      properties:
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host]
            properties:
              host: {type: string}
              port:
                type: integer
                minimum: 1
                maximum: 65535
                description: The container port the domain routes to. Optional when the service has one port.
        health:
          type: object
          additionalProperties: false
          description: |
            The check Nomad runs. Without it, a service with ports is checked over TCP on its
            first port.
          properties:
            path:
              type: string
              description: Makes it an HTTP check on this path. Empty means a TCP check.
            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: The container port to check. Optional when the service has one port.
            interval:
              $ref: "#/components/schemas/Duration"
            timeout:
              $ref: "#/components/schemas/Duration"
        secrets:
          type: array
          description: The service's secrets, with the meaning `Service.secrets` has.
          items:
            $ref: "#/components/schemas/Secret"
        backup:
          $ref: "#/components/schemas/BackupPolicy"

    BackupPolicy:
      type: object
      additionalProperties: false
      required: [engine]
      description: |
        Makes the service a database Caravana backs up to the backup destination. The service
        needs ports and `POSTGRES_PASSWORD` in its env or secrets.
      properties:
        engine:
          type: string
          enum: [postgres]
        schedule:
          type: string
          description: Five-field cron, in UTC. Leave it out for `0 3 * * *`.
        keep:
          type: integer
          minimum: 1
          maximum: 100
          description: How many backups stay. Leave it out for 7.

    BackupDestination:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, prefix, accessKeyId, updatedAt]
      properties:
        endpoint: {type: string, examples: ["https://s3.eu-west-1.amazonaws.com"]}
        region: {type: string}
        bucket: {type: string}
        prefix: {type: string}
        accessKeyId: {type: string}
        updatedAt: {type: string, format: date-time}

    BackupDestinationRequest:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, accessKeyId]
      properties:
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        prefix: {type: string}
        accessKeyId: {type: string}
        secretAccessKey:
          type: string
          writeOnly: true

    Backup:
      type: object
      additionalProperties: false
      required: [id, service, status, bytes, startedAt]
      properties:
        id: {type: string, examples: ["db-1791386036"]}
        service: {type: string}
        status:
          type: string
          enum: [running, succeeded, failed]
        bytes: {type: integer}
        message:
          type: string
          description: Why it failed, as the dump or the upload said.
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}

    Restore:
      type: object
      additionalProperties: false
      required: [id, service, backupId, status, createdAt]
      properties:
        id: {type: string}
        service: {type: string}
        backupId: {type: string}
        status:
          type: string
          enum: [running, succeeded, failed]
        message: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}

    BackupList:
      type: object
      additionalProperties: false
      required: [backups, restores]
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        restores:
          type: array
          items:
            $ref: "#/components/schemas/Restore"

    ComposePreview:
      type: object
      additionalProperties: false
      required: [app, warnings]
      properties:
        app:
          $ref: "#/components/schemas/App"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    Secret:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          description: Unique across the service's secrets and env.
        value:
          type: string
          writeOnly: true
          description: |
            UTF-8 text without NUL. Leave it out to keep the value the secret has now. Never
            returned.

    Duration:
      type: string
      description: A Go duration string, e.g. `"10s"` or `"1m30s"`.
      pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
      examples: ["10s"]

    AppRecord:
      type: object
      additionalProperties: false
      required: [app, createdAt, updatedAt]
      properties:
        app:
          $ref: "#/components/schemas/App"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    AppSummary:
      type: object
      additionalProperties: false
      required: [app, createdAt, updatedAt, status]
      properties:
        app:
          $ref: "#/components/schemas/App"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        status:
          $ref: "#/components/schemas/AppStatus"
        lastDeployment:
          $ref: "#/components/schemas/Deployment"

    AppSummaryList:
      type: object
      additionalProperties: false
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppSummary"

    AppStatus:
      type: object
      additionalProperties: false
      required: [state, wantedCopies, healthyCopies]
      properties:
        state:
          type: string
          enum: [rolling_out, healthy, degraded, not_running, unknown]
        wantedCopies: {type: integer, minimum: 0}
        healthyCopies: {type: integer, minimum: 0}
        liveVersion:
          type: integer
          minimum: 0
          description: The job version the healthy copies run. Absent when no copy is healthy.

    Copy:
      type: object
      additionalProperties: false
      required: [id, service, node, version, status, restarts]
      properties:
        id:
          type: string
          description: The Nomad allocation ID.
        service:
          type: string
        node:
          type: string
          description: The name of the node the copy runs on.
        version:
          type: integer
          minimum: 0
          description: The job version the copy runs.
        status:
          type: string
          enum: [starting, healthy, unhealthy, stopped, failed]
        restarts:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
          description: When the copy's first task started. Absent until one has.
        description:
          type: string
          description: Nomad's own description of the copy's state, e.g. `Tasks are running`.

    CopyList:
      type: object
      additionalProperties: false
      required: [copies]
      properties:
        copies:
          type: array
          items:
            $ref: "#/components/schemas/Copy"

    LogLine:
      type: object
      additionalProperties: false
      required: [copy, service, stream, text]
      properties:
        copy:
          type: string
          description: The ID of the copy that wrote it.
        service:
          type: string
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
          description: One line without its newline. Plain text; invalid UTF-8 is replaced and a line over 64 KiB is cut.
        time:
          type: string
          format: date-time
          description: When Caravana received the line. Only on followed lines; the recent lines have none.

    LogLines:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"

    Deployment:
      type: object
      additionalProperties: false
      required: [id, appId, trigger, status, digests, warnings, definitionRecorded, createdAt, updatedAt]
      properties:
        id:
          type: string
        appId:
          type: string
        trigger:
          type: string
          enum: [manual, webhook, console]
        status:
          type: string
          enum: [pending, running, healthy, failed, reverted, superseded]
          description: |
            `healthy`, `failed`, `reverted` (failed, and Nomad rolled back to the previous
            version) and `superseded` (a newer deploy replaced it) are final.
        jobVersion:
          type: integer
          minimum: 0
          description: The Nomad job version. Absent until Nomad accepts the job.
        digests:
          type: object
          description: Each service's image as deployed, pinned by digest.
          additionalProperties:
            type: string
            pattern: "@sha256:[a-f0-9]{64}$"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        error:
          type: string
          description: Why it failed, reverted or was superseded. Absent otherwise.
        source:
          type: string
          description: The deployment this one redeployed (`redeployDeployment`). Absent otherwise.
        definitionRecorded:
          type: boolean
          description: |
            Whether Caravana saved what this deployment deployed. Only then can it be exported,
            and redeployed once healthy. False for deployments from before version 0.9.0.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        progress:
          $ref: "#/components/schemas/Progress"

    Progress:
      type: object
      additionalProperties: false
      description: |
        How far a rollout has got, summed over the app's services. Only on a deployment that is
        `running`, and only from `getDeployment` and, for the newest running one, from
        `listDeployments`. Absent when Nomad has no rollout for the deployment yet or can't be
        read.
      required: [wanted, placed, healthy, unhealthy, canariesWanted, promoted]
      properties:
        wanted: {type: integer, minimum: 0, description: New copies the rollout wants in all.}
        placed: {type: integer, minimum: 0, description: New copies Nomad has placed.}
        healthy: {type: integer, minimum: 0, description: New copies that passed their health checks.}
        unhealthy: {type: integer, minimum: 0, description: New copies that failed their health checks.}
        canariesWanted:
          type: integer
          minimum: 0
          description: Copies that wait for promotion before the old ones are replaced (blue/green).
        promoted:
          type: boolean
          description: Every service that waits for promotion has been promoted.
        description:
          type: string
          description: Nomad's own status description of the rollout.

    DeploymentList:
      type: object
      additionalProperties: false
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"

    WebhookToken:
      type: object
      additionalProperties: false
      required: [token, path, createdAt]
      properties:
        token:
          type: string
          pattern: "^cvwh_[A-Za-z0-9_-]{43}$"
          description: "Shown only here. Store it in the sender (registry, CI secret)."
        path:
          type: string
          description: The webhook path with the token, e.g. `/v1/webhooks/whoami?token=cvwh_…`.
        createdAt: {type: string, format: date-time}

    WebhookStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: When the current token was created. Absent when `enabled` is false.

    WebhookResult:
      type: object
      additionalProperties: false
      required: [changed, deployment]
      properties:
        changed:
          type: boolean
          description: "True when the call started a deployment; false when nothing changed."
        deployment:
          $ref: "#/components/schemas/Deployment"

    Warning:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The input field the warning is about; empty when it isn't about one.
        message:
          type: string

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable error code. Clients must accept codes they don't
                know. Current codes: `bad_request`, `invalid_field`, `unknown_field`,
                `unsupported_media_type`, `body_too_large`, `not_found`,
                `method_not_allowed`, `internal`, `unavailable`, `image_not_found`,
                `job_conflict`, `registry_unavailable`, `nomad_unavailable`,
                `nomad_rejected`, `unauthorized`, `cross_origin`, `token_name_taken`, `app_exists`,
                `secret_store_unavailable`, `backup_running`, `no_backup_destination`,
                `deployment_not_healthy`, `definition_not_recorded`, `no_live_deployment`.
              examples: [invalid_field]
            message:
              type: string
              description: Human-readable explanation. Not meant to be parsed.
            field:
              type: string
              description: |
                The one request field at fault, as a path like
                `services[0].domains[1].port`. Absent when no single field is at fault.
              examples: ["services[0].domains[1].port"]


    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          description: A wrong one gets 400 `invalid_field` with `field` `currentPassword`.
        newPassword:
          type: string
          writeOnly: true
          minLength: 12
          description: At least 12 characters. A shorter one gets 400 `invalid_field`.

    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          description: A label for the token, such as where it is used.
          examples: [ci-github]
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working. Must be in the future. Absent means never.

    TokenInfo:
      type: object
      # No `additionalProperties: false` here: CreatedToken extends this schema with
      # `token`, and a closed base would reject it.
      required: [id, name, createdAt, state]
      properties:
        id:
          type: string
          description: The token's ID, used to revoke it. Not the token itself.
          examples: ["p4nzr2t6v3x7z5bqd7f4h6j3kq"]
        name:
          type: string
          examples: [ci-github]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Absent until first used. Updated at most once a minute.
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [active, expired, revoked]

    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/TokenInfo"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token, shown only in this response.
              pattern: "^cvat_[A-Za-z0-9_-]{43}$"

    TokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenInfo"

  responses:
    Jobspec:
      description: |
        The jobspec, as a download named `<app>.nomad.hcl`. Errors are JSON, as everywhere.
      headers:
        Content-Disposition:
          description: '`attachment; filename="<app>.nomad.hcl"`'
          schema: {type: string}
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: The server can't reach its store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: |
        The request is invalid (`bad_request`, `invalid_field`, `unknown_field`); `field`
        names the field at fault. Nothing was saved or recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No app with this ID is stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: The request body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The body isn't `application/json` in UTF-8.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BackupConflict:
      description: |
        `backup_running`: a backup or restore of this service is running; try again when it
        ends. `no_backup_destination`: no backup destination is set.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobConflict:
      description: |
        `job_conflict`: Nomad already runs a job with this app's ID that Caravana didn't
        create, or the job changed while deploying. Nothing was registered; the deployment
        record (see `Location`) is `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ImageNotFound:
      description: |
        `image_not_found`: the registry has no such image or tag, or it's private (registry
        credentials aren't supported yet). `field` is the service's `image`. Nothing was
        registered; the deployment record (see `Location`) is `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: |
        The registry or Nomad couldn't be used: `registry_unavailable` (unreachable, erroring
        or rate-limiting; `field` is the service's `image`), `nomad_unavailable` (unreachable
        or the token was refused) or `nomad_rejected` (the message is what Nomad said). The
        deployment record (see `Location`) is `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NomadUnavailable:
      description: |
        Nomad couldn't be used: `nomad_unavailable` (unreachable, or the token was refused) or
        `nomad_rejected` (the message is what Nomad said). Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        `unauthorized`. On API routes: no valid API token or session (missing, malformed,
        wrong, expired or revoked, or no admin exists yet). On the webhook: the webhook token is
        missing or wrong, or the app has none, or there is no such app. Every reason gets the
        same answer.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: |
        `cross_origin`: a state-changing request authenticated by the session cookie came from
        another site. Nothing was changed. Requests with an API token never get this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenNameTaken:
      description: "`token_name_taken`: an active token already has this name. `field` is `name`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected server error. Details are in the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

tags:
  - name: system
    description: Server health.
  - name: apps
    description: Stored app definitions.
  - name: deployments
    description: Deploying apps and following their rollouts.
  - name: webhooks
    description: Webhook tokens, and the webhook that redeploys an app.
  - name: tokens
    description: API tokens for clients (CI, scripts, the Aspire integration).
  - name: account
    description: The one admin account.
