  /v1/registries:
    get:
      operationId: listRegistries
      summary: List the registries Caravana has credentials for, never the secrets.
      description: Ordered by host. Public images from any registry deploy without an entry here.
      tags: [registries]
      responses:
        "200":
          description: The registries.
          content:
            application/json:
              schema:
                type: array
