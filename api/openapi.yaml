openapi: 3.1.0
info:
  title: Caravana API
  version: 0.24.0
  summary: Self-hosted PaaS on HashiCorp Nomad.
  description: |
    Every endpoint lives under `/v1`. Request bodies are `application/json`, with or without
    parameters such as `charset=UTF-8`. Unknown body fields are rejected.

    Every error is `{"error": {"code", "message", "field"}}` with the matching 4xx or 5xx
    status, including 404 for unknown paths and 405 for wrong methods. The API never answers
    a request with a redirect. An error raised after a deployment record exists also carries a
    `Location` header pointing at that record.

    Durations (`health.interval`, `health.timeout`) are Go duration strings such as `"10s"` or
    `"1m30s"`, in requests and responses.

    Secret values (`services[].secrets[].value`) are write-only. They are kept in the cluster's
    secret store, never in an app read back, a deployment or the Nomad job. A store that can't
    be written fails the deploy with 502 `secret_store_unavailable` before Nomad gets the job.

    Every endpoint needs authentication except `GET /v1/health` and `POST /v1/webhooks/{id}`.
    Clients send an API token as `Authorization: Bearer cvat_…`; the admin creates tokens on the
    host (`caravana admin create-token`), on the web account page, or with `createToken`. A
    browser signed in to the web UI may use its session cookie instead; then every
    state-changing request must come from caravana's own pages, or it gets 403
    `cross_origin`. A request without valid credentials gets 401 `unauthorized`, the same for
    every reason (missing, malformed, wrong, expired or revoked token, no admin yet), and is
    never redirected.

    A token made with a `scope` (`createToken`) is a deploy token: it can only deploy one app
    name of one project, in any environment. With it, only `getApp`, `getCompose`,
    `listDeployments`, `getDeployment`, `deployApp`, `deployCompose`, `previewPromotion` and
    `promoteApp` (for that app's ID), `createApp` (for an ID in scope), and
    `createEnvironmentApp` and `getEnvironmentApp` (for that project and app name) answer.
    Every other request, and those about another app, is 403 `token_scope`, before any work.

    `deployApp`, `deployCompose`, `promoteApp` and `callWebhook` accept optional
    `Caravana-Origin-*` headers saying where the deploy came from (a CI run); see
    `Deployment.origin`.

    `POST /v1/webhooks/{id}` needs the app's webhook token instead, and is also served, alone,
    on the optional webhook-only listener. Webhook tokens and API tokens never stand in for
    each other.
  license:
    name: AGPL-3.0-only
    identifier: AGPL-3.0-only
servers:
  - url: http://127.0.0.1:7070
    description: Local default
security:
  - apiToken: []
  - session: []
paths:
  /v1/health:
    get:
      operationId: getHealth
      summary: Report whether the server and its store are up.
      description: Unauthenticated, now and later. Meant for load balancers and install scripts.
      tags: [system]
      security: []
      responses:
        "200":
          description: The server is up and its store is reachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          $ref: "#/components/responses/Unavailable"

  /v1/apps:
    get:
      operationId: listApps
      summary: List every app with its current status, by ID.
      description: |
        With `project` and/or `environment`, only the apps there. A project, or an environment
        of the project, that doesn't exist is `404 project_not_found` or
        `404 environment_not_found`, not an empty list. An `environment` alone matches that
        name in every project. An empty value means no filter.
      tags: [apps]
      parameters:
        - name: project
          in: query
          description: Only apps of this project.
          schema: {type: string}
        - name: environment
          in: query
          description: Only apps in environments of this name (of the `project`, when given).
          schema: {type: string}
      responses:
        "200":
          description: |
            All apps. When Nomad can't be read, each status is `unknown` and the stored
            data is still returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSummaryList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createApp
      summary: Create a new app and start its first deployment, or only save it.
      description: |
        Like `deployApp` with a body, but never replaces a stored app: an existing ID is
        `409 app_exists` and nothing changes. Follow the rollout at `Location`.

        With `deploy=false` the app is only saved: `201` and the stored app, no deployment, no
        Nomad job, and nothing on the needs-you list. The body may then hold a full definition
        (checked as a deploy checks it; the first `deployApp` with an empty body, or the app's
        webhook, then deploys it as stored) or only an `id` and a `name`: the app then has no
        services (`defined: false`) and a redeploy as stored is `409 app_not_defined` until a
        deploy brings a definition (`deployApp` with a body, `deployCompose`). Secret names may
        be listed, never their values: a value is `400 invalid_field` on
        `services[i].secrets[j].value`, since values are only sent with a deploy.

        The ID places the app (see the `id` path parameter): `shop--staging--web` is `web` in
        environment `staging` of project `shop`, which must exist, else
        `404 project_not_found` or `404 environment_not_found` with `field: "id"`; an ID with
        `--` that isn't `<project>--<environment>--<name>` is `400 invalid_field` on `id`.
      tags: [apps]
      parameters:
        - $ref: "#/components/parameters/DeployFlag"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewApp"
      responses:
        "201":
          $ref: "#/components/responses/AppCreated"
        "202":
          description: Saved; Nomad accepted the job (`deploy` true or absent).
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "409":
          description: |
            `app_exists` (`field: "id"`): an app with this ID is stored. Or `job_conflict`,
            as for `deployApp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/deployments:
    get:
      operationId: listRecentDeployments
      summary: List the newest deployments across all apps.
      tags: [deployments]
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        "200":
          description: The newest deployments, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/attention:
    get:
      operationId: listAttention
      summary: List what needs the owner.
      description: |
        The "needs you" list the console's home shows, newest first: an app whose latest deploy
        failed or was reverted, a copy that ran out of memory, keeps restarting or fails its
        health check, a service whose latest backup or restore failed, and backups asked for
        with no backup destination. It is computed on each call and nothing is stored: an item
        is there while its condition is. Copies of the job version a failed deployment
        registered add no items of their own, and copies of one service with the same problem
        are one item.

        When Nomad can't be read the answer is still 200 with `copiesUnknown: true`, and only
        the kinds that come from Caravana's own records (`deploy_failed`, `backup_failed`,
        `restore_failed`, `no_backup_destination`) are listed.
      tags: [apps]
      responses:
        "200":
          description: What needs the owner; empty when nothing does.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attention"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/projects:
    get:
      operationId: listProjects
      summary: List the projects with their environments.
      description: |
        Project `default` first, then by creation. Every installation has `default` with its
        `production` environment: the apps that existed before projects are there.
      tags: [projects]
      responses:
        "200":
          description: The projects.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createProject
      summary: Create a project.
      description: |
        A project starts with one environment, `production`. Its `name` is part of its apps'
        IDs and never changes; `displayName` is what the console shows.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectRequest"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The project's URL, `/v1/projects/{project}`.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/PlaceExists"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/PlaceInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/projects/{project}:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    get:
      operationId: getProject
      summary: Read a project with its environments.
      tags: [projects]
      responses:
        "200":
          description: The project.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    patch:
      operationId: updateProject
      summary: Change a project's display name.
      description: |
        The only thing about a project that can change: its name is part of every app's ID.
        `default` may be renamed for display.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdate"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/PlaceInvalid"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteProject
      summary: Delete a project and its environments.
      description: |
        Refused while any app is in the project (`409 not_empty`, the message names them), and
        for `default` (`409 protected`): apps that existed before projects are in it.
      tags: [projects]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "409":
          $ref: "#/components/responses/PlaceInUse"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/projects/{project}/environments:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
    post:
      operationId: createEnvironment
      summary: Add an environment to a project.
      description: It starts empty and is listed after the project's other environments.
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentRequest"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "409":
          $ref: "#/components/responses/PlaceExists"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/PlaceInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/projects/{project}/environments/{environment}:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
      - $ref: "#/components/parameters/EnvironmentName"
    delete:
      operationId: deleteEnvironment
      summary: Delete an environment.
      description: |
        Refused while any app is in it (`409 not_empty`, the message names them), and for
        `production` of project `default` (`409 protected`).
      tags: [projects]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "409":
          $ref: "#/components/responses/PlaceInUse"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/projects/{project}/environments/{environment}/apps:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
      - $ref: "#/components/parameters/EnvironmentName"
    get:
      operationId: listEnvironmentApps
      summary: List the apps of one environment, with their status, by ID.
      description: |
        As `listApps` with both filters, but a bare array. When Nomad can't be read, each
        status is `unknown` and the stored data is still returned.
      tags: [projects]
      responses:
        "200":
          description: The apps in the environment; empty when it has none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createEnvironmentApp
      summary: Create an app in this environment and start its first deployment, or only save it.
      description: |
        As `createApp`, for the ID these names make (`<project>--<environment>--<appName>`, or
        the bare `appName` in `default`/`production`): it never replaces a stored app, and an
        ID that is taken is `409 app_exists`. `id` may be left out; when given it must equal
        that ID. Follow the rollout at `Location`. `deploy=false` only saves the app, with a
        definition or with `appName` alone, exactly as for `createApp`.
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/DeployFlag"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentAppRequest"
      responses:
        "201":
          $ref: "#/components/responses/AppCreated"
        "202":
          description: Saved; Nomad accepted the job (`deploy` true or absent).
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "409":
          description: |
            `app_exists` (`field: "id"`): an app with this ID is stored. Or `job_conflict`, as for
            `deployApp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            `invalid_field` with `field` `appName`: not a lowercase label, or it holds `--`. Or
            `image_not_found` and `registry_auth_failed`, as for `createApp`.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/projects/{project}/environments/{environment}/apps/{name}:
    parameters:
      - $ref: "#/components/parameters/ProjectName"
      - $ref: "#/components/parameters/EnvironmentName"
      - name: name
        in: path
        required: true
        description: The app's name in the environment, as `appName` says.
        schema:
          $ref: "#/components/schemas/Name"
    get:
      operationId: getEnvironmentApp
      summary: Read an app by its project, environment and name.
      description: As `getApp`, for the ID these names make, with the revision as `ETag`.
      tags: [projects]
      responses:
        "200":
          description: The stored app.
          headers:
            ETag:
              $ref: "#/components/headers/AppETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/PlaceNotFound"
        "422":
          $ref: "#/components/responses/PlaceInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getApp
      summary: Read an app as it was last sent.
      description: |
        The answer carries the app's `revision` (also as the `ETag` header): a short name for
        this exact stored definition. Send it back as `If-Match` on `deployApp` or
        `deployCompose` to deploy a change only if nobody changed the app since you read it.
      tags: [apps]
      responses:
        "200":
          description: The stored app.
          headers:
            ETag:
              $ref: "#/components/headers/AppETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppRecord"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteApp
      summary: Delete an app for good.
      description: |
        Stops and purges the app's Nomad job, deletes its secrets, then erases the app, its
        deployments and its webhook token. If Nomad can't stop the job or the secrets can't be
        deleted, the app is kept and the call can be made again. Not reversible; the ID can be used for a new app afterwards.
      tags: [apps]
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/copies:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listCopies
      summary: List the app's copies (Nomad allocations).
      description: |
        Every copy that hasn't ended, plus the ended copies of the app's latest job version
        that Nomad still keeps. Ordered by service, then job version (newest first), then start
        time.

        With `usage=true`, each copy that is running also has `usage`: its CPU and memory now,
        next to what its service reserves. That asks Nomad once per copy, so leave it off when
        the list is enough.
      tags: [apps]
      parameters:
        - name: usage
          in: query
          description: Add each running copy's CPU and memory use.
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: The app's copies; empty when it has none.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/volumes:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listVolumes
      summary: List an app's volumes, with their size and backup state.
      description: |
        The volumes in the app's stored definition, then the volumes Nomad still has for the app
        that no service mounts any more (`mounted: false`; they stay until the app is deleted).

        Sizes are measured by each copy's `caravana-volumes` task when the copy starts, so a
        volume of an app deployed before volume backups existed has no `size` until the app is
        deployed again. A running copy is asked for its newest measurement; a copy that doesn't
        answer in 2 seconds leaves the stored one. When Nomad can't be read the answer is still
        200: `hostPath` is absent and the unmounted volumes are not listed.
      tags: [backups]
      responses:
        "200":
          description: In the order of the definition, unmounted volumes last; empty when the app has none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppVolume"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/copies/{copyId}/run:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: copyId
        in: path
        required: true
        description: The copy's ID, as `listCopies` gives it.
        schema: {type: string}
    post:
      operationId: runCommand
      summary: Run one command in a running copy and answer with what it printed.
      description: |
        Runs the program and its arguments in the copy's service container, without a shell, a
        terminal or input (for a shell, send `["sh", "-c", "…"]`). It stops after 60 seconds
        (`timedOut`), and each of `stdout` and `stderr` is cut at 64 KiB (`stdoutTruncated`,
        `stderrTruncated`). A program the image doesn't have answers 200 with `failedToStart`
        and Nomad's reason in `stderr`.

        The output may hold a secret, so it is shown in this answer and nowhere else: it is
        never stored, logged, cached (the answer has `Cache-Control: no-store`) or put in a
        live notice. What Caravana keeps, and `listAppActions` shows, is when the command ran,
        in which copy, how it was asked for, its first word and its exit code, never the
        arguments or the output. A command doesn't change the app, so it needs no lock.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [command]
              properties:
                command:
                  type: array
                  minItems: 1
                  maxItems: 64
                  description: |
                    The program, then its arguments. Each item is at most 4096 bytes and has no
                    NUL byte; the program is not empty. Otherwise 400 `invalid_field` with
                    `field` `command`.
                  items:
                    type: string
                    maxLength: 4096
      responses:
        "200":
          description: The command ran (or didn't start, or timed out); see the fields.
          headers:
            Cache-Control:
              description: "`no-store`."
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: No such app, or the copy isn't one of the app's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`copy_not_running`: the copy has ended or isn't running."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/copies/{copyId}/terminal:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: copyId
        in: path
        required: true
        description: The copy's ID, as `listCopies` gives it.
        schema: {type: string}
      - name: shell
        in: query
        required: false
        description: |
          Which shell to start in the service's container. `auto` (the default) starts `bash`
          when the image has it and `sh` otherwise, through `/bin/sh -c`; `bash` runs
          `/bin/bash` and `sh` runs `/bin/sh`. Anything else is 422 `invalid_field`.
        schema: {type: string, enum: [auto, bash, sh], default: auto}
      - name: cols
        in: query
        required: false
        description: The terminal's width in characters, 1 to 1000. Otherwise 422 `invalid_field`.
        schema: {type: integer, minimum: 1, maximum: 1000, default: 80}
      - name: rows
        in: query
        required: false
        description: The terminal's height in characters, 1 to 1000. Otherwise 422 `invalid_field`.
        schema: {type: integer, minimum: 1, maximum: 1000, default: 24}
    get:
      operationId: openTerminal
      summary: Open an interactive shell in a running copy, over a websocket.
      description: |
        Send a websocket upgrade request (`Upgrade: websocket`); the answer is 101 and then the
        protocol below. Until the upgrade, errors are the usual JSON ones. Without an upgrade
        request, 400 `bad_request`.

        A terminal is root-equivalent access to the container, so it is narrow: a **full** API
        token (`Authorization: Bearer`, no `Origin` check) or a browser session whose `Origin`
        header is the console's own origin (the scheme and host the request arrived with, as
        trusted proxies say). A session without that header, or with another, is 403
        `cross_origin`. A deploy token is 403 `token_scope`.

        **Frames from the client**, text, JSON, at most 64 KiB each:

        - `{"type":"input","data":"<utf-8 text>"}`: keystrokes and pasted text.
        - `{"type":"resize","cols":N,"rows":M}`: the terminal's new size, 1 to 1000.

        Anything else (a binary frame, another type, a bad size) closes the connection with
        1003.

        **Frames from the server:** binary frames with the shell's output bytes as they come
        (a terminal merges standard error into standard output), and, last, one text frame
        `{"type":"exit","code":N}` when the shell exited (with `"message":"no shell found in
        this image"` when it never started: exit 126 or 127 before anything was typed) or
        `{"type":"exit","reason":"idle|limit|error","message":"…"}`, followed by a normal close
        (1000). `idle` is 15 minutes without input and `limit` is 60 minutes open; `error`
        covers Caravana or Nomad failing, a missing shell (`no shell found in this image`) and
        credentials that stopped being valid. The server pings every 30 seconds; no pong and no
        input for 60 seconds ends the session. A browser that closes the connection ends it.

        At most five terminals are open at once, 429 `too_many_terminals` after that. Nothing
        typed or printed is ever stored, logged or put in a notice: what Caravana keeps, and
        `listAppActions` shows, is that a session ran (action `terminal`), in which copy and
        service, how it was asked for, the shell asked for, its exit code or the reason it
        ended. A terminal doesn't change the app, so it takes no lock; stopping the app ends
        its copies and with them the session.
      tags: [apps]
      responses:
        "101":
          description: |
            Switching Protocols: the connection is now the websocket described above.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            `cross_origin` (a session cookie whose `Origin` isn't the console's, or is missing)
            or `token_scope` (a deploy token). Nothing was opened.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such app, or the copy isn't one of the app's.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `copy_not_running` (the copy has ended or isn't running), `app_stopped` (the app is
            stopped: start it first) or `app_not_defined` (the app was never deployed).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: |
            `invalid_field`: `shell`, `cols` or `rows` isn't valid; `field` names it.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: "`too_many_terminals`: five terminals are already open."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: stopApp
      summary: Stop every copy of the app, keeping everything else.
      description: |
        Stops the app's Nomad job and its scheduled Postgres backup jobs without deleting them.
        The app's definition, secrets, volumes, backups, webhook token and history stay. Until
        `startApp`, every deploy of the app (a deploy, the webhook, a promotion into it, a
        redeploy of a version, an edit) is 409 `app_stopped`, its backups and restores too,
        and its scheduled backups are skipped, not failed. The app's status is `stopped`.
        The action is recorded (`listAppActions`); it is no deployment.

        409 `app_busy` while a deploy, a volume backup or another action of the app is
        running. 409 `app_not_defined` or `no_live_deployment` for an app that was never
        deployed.
      tags: [apps]
      responses:
        "200":
          description: The stopped app with its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ActionConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/start:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: startApp
      summary: Start a stopped app again, exactly as it was.
      description: |
        Starts the job `stopApp` stopped, and its backup jobs: the same definition, the same
        pinned images, no tag looked up. Nothing is deployed and no deployment is recorded;
        Nomad makes a new job version of the same job. 409 `app_not_stopped` when the app
        isn't stopped; 409 `app_busy`, `app_not_defined` and `no_live_deployment` as for
        `stopApp`.
      tags: [apps]
      responses:
        "200":
          description: The app with its status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ActionConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/restart:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: restartApp
      summary: Restart the app's copies one at a time.
      description: |
        Restarts each running copy of the app's live version in turn and waits for it to run
        again (and to pass its checks, when its service has a health check) before the next,
        so an app with several copies keeps answering. It returns at once with the action,
        `running`; the restarts happen in the background while the app's lock is held, so a
        deploy that comes meanwhile waits. Follow it with `listAppActions`: it ends
        `succeeded`, or `failed` with the copy that didn't come back within two minutes. A
        restart asked for this way never counts as a crash loop.

        409 `app_stopped` for a stopped app, `no_running_copy` when no copy of the live
        version runs, `app_busy`, `app_not_defined` and `no_live_deployment` as for `stopApp`.
      tags: [apps]
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/ActionConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/actions:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listAppActions
      summary: List the app's latest actions (stop, start, restart, run, terminal).
      description: |
        The newest 20, newest first. A run has its first word (`program`) and exit code; a
        terminal session has the shell asked for (`program`), its exit code and, when it ended
        another way, the reason in `error`; none of them has command output, arguments, input
        or screen.
      tags: [apps]
      responses:
        "200":
          description: Newest first; empty when the app has had none.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AppAction"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getLogs
      summary: Read the app's recent output, or follow it.
      description: |
        Without `follow`, returns up to `lines` recent lines as JSON, oldest first. With
        `follow=true`, answers `text/event-stream`: the same recent lines as `log` events, then
        each new line as it is written, a comment line every 20 seconds while idle, until the
        client disconnects or its credentials end (then an `ended` event, and the stream
        closes). Errors found before the stream starts are JSON as usual. Following doesn't
        renew a browser session.

        Nomad's lines carry no time, so the recent lines are ordered per copy, copies in the
        order they started, each copy's `stdout` before its `stderr`. Followed lines are
        interleaved as they arrive and carry `time`. Output is plain text: show it as text,
        never as markup.
      tags: [apps]
      parameters:
        - name: copy
          in: query
          description: One copy's ID, from `listCopies`. Absent means every listed copy.
          schema:
            type: string
        - name: stream
          in: query
          schema:
            type: string
            enum: [stdout, stderr, both]
            default: both
        - name: lines
          in: query
          description: How many recent lines to start with.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 500
        - name: follow
          in: query
          schema:
            type: boolean
            default: false
      responses:
        "200":
          description: Recent output as JSON, or, with `follow=true`, as an event stream.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogLines"
            text/event-stream:
              schema:
                type: string
                description: |
                  `event: log` with `data:` one `LogLine` as JSON; `event: ended` with no data
                  when the stream ends because its credentials ended.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such app, or `copy` isn't one of its copies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/apps/{id}/compose:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: getCompose
      summary: Read the Compose file the app was last deployed from.
      description: |
        The request of the last `deployCompose` (or of the version `redeployDeployment` brought
        back): the file text exactly as it was sent, with its overlay. Secret values are never
        returned: each secret in `services` has its `name` only. Sending the answer back to
        `deployCompose` unchanged keeps every secret's current value, and with the `ETag` as
        `If-Match` it is a safe edit.

        An app deployed from an image or a definition has no file: 404 `compose_not_kept`
        (`composeKept` is false on the app). So does an app made from Compose before its file
        was kept, until it is deployed from Compose once more. A deploy from a definition
        (`deployApp` with a body) drops the file.
      tags: [apps]
      responses:
        "200":
          description: The kept request.
          headers:
            ETag:
              $ref: "#/components/headers/AppETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          description: No such app (`not_found`), or it has no kept file (`compose_not_kept`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: deployCompose
      summary: Save an app from a Compose file and deploy it.
      description: |
        The Compose file is turned into an app (source kind `compose`) and deployed exactly
        like `deployApp` does with a body: saved under this ID, replacing the stored app, and
        rolled out. The file is kept as it was sent, comments included, with the app and with
        the deployment, and `getCompose` and `getDeploymentCompose` give it back. Secret values
        are not kept with it: they go to the secret store only. Redeploys use the stored app.

        Every attribute of the file is honored, honored with a warning in the deployment's
        `warnings`, or refused with 400 naming it in `field` as a path in the file
        (`services.web.build`). `x-` extensions are ignored. Variables (`${NAME}`) take only the
        file's own defaults. What Compose has no words for (public domains, a health check
        Nomad can run, secret values) goes in `services`, next to the file.

        Two optional preconditions make the save safe against other writers. `If-Match` with the
        `revision` from `getApp` saves only if the stored app still has it, else `412
        app_changed` and nothing is saved or deployed. `If-None-Match: *` creates the app only if
        the ID is free, else `409 app_exists` (`field: "id"`). Sending both is `400`.
      tags: [deployments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/IfNoneMatch"
        - $ref: "#/components/parameters/OriginCommit"
        - $ref: "#/components/parameters/OriginRef"
        - $ref: "#/components/parameters/OriginActor"
        - $ref: "#/components/parameters/OriginRun"
        - $ref: "#/components/parameters/OriginRepository"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "202":
          description: Nomad accepted the job; follow it like any deployment.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: |
            `If-Match` was sent, and no app with this ID is stored. Or the ID is new and names a
            project or environment that doesn't exist: `project_not_found` or
            `environment_not_found`, with `field: "id"`, and nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `app_exists` (`field: "id"`): `If-None-Match: *` was sent and an app with this ID is
            stored. Or `job_conflict` or `app_stopped`, as for `deployApp`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "412":
          $ref: "#/components/responses/AppChanged"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/compose/preview:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: previewCompose
      summary: Show the app a Compose file becomes, without saving or deploying it.
      description: |
        Takes the same body as `deployCompose` and answers with the app it would deploy and the
        warnings it would carry. Nothing is saved, deployed or asked of Nomad. Secrets list
        names only.
      tags: [deployments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComposeRequest"
      responses:
        "200":
          description: The app and its warnings.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/backups/destination:
    get:
      operationId: getBackupDestination
      summary: Read where backups go, without the secret key.
      tags: [backups]
      responses:
        "200":
          description: The destination.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDestination"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: setBackupDestination
      summary: Set where backups go.
      description: |
        One S3-compatible bucket for the installation. Leave `secretAccessKey` out to keep the
        one set before; it is required the first time and never returned. Every backup
        schedule uses the new destination from its next run, without a deploy.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BackupDestinationRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupDestination"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/registries:
    get:
      operationId: listRegistries
      summary: List the registries Caravana has credentials for, never the secrets.
      description: Ordered by host. Public images from any registry deploy without an entry here.
      tags: [registries]
      responses:
        "200":
          description: The registries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/registries/{host}:
    parameters:
      - $ref: "#/components/parameters/RegistryHost"
    put:
      operationId: putRegistry
      summary: Store the credentials for a private registry.
      description: |
        Creates the entry or replaces the one with this host. `password` is required when
        creating and optional when updating: leave it out to keep the secret stored before.
        It is never returned. Nothing is deployed or restarted: the next deploy of an image
        from this registry uses the credentials, and apps already running pick them up the next
        time they start. A save that changes the credentials forgets the last test.
      tags: [registries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/RegistryInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteRegistry
      summary: Forget the credentials for a registry.
      description: |
        Apps already running keep running. The next deploy of a private image from this
        registry fails until credentials are added again.
      tags: [registries]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/registries/{host}/test:
    parameters:
      - $ref: "#/components/parameters/RegistryHost"
    post:
      operationId: testRegistry
      summary: Ask the registry to accept the stored credentials.
      description: |
        Makes one request to the registry and records the outcome with its time. A registry
        that refuses the credentials or can't be reached is an answer, not an error: the
        response is 200 and `lastTest.ok` is false, with the reason in `lastTest.message`.
      tags: [registries]
      responses:
        "200":
          description: The registry, with `lastTest` updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/notifications/channels:
    get:
      operationId: listNotificationChannels
      summary: List the notification channels, never their secrets.
      description: Oldest first.
      tags: [notifications]
      responses:
        "200":
          description: The channels.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationChannel"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createNotificationChannel
      summary: Add a notification channel.
      description: |
        A channel is a place Caravana tells things to: what needs the owner (the `problems`
        events, sent when an item opens and when it has been gone for a while) and how deploys
        end (`deploy_failed`, `deploy_succeeded`). The channel's secret parts (a Slack or
        Discord URL, an ntfy token, a webhook's signing secret) are kept in the cluster's
        secret store and are never returned. A webhook channel's answer carries its
        `signingSecret`, this once: `rotateNotificationSecret` makes a new one.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelInput"
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannelCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/NotificationInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/notifications/channels/{id}:
    parameters:
      - $ref: "#/components/parameters/NotificationChannelID"
    patch:
      operationId: updateNotificationChannel
      summary: Change a notification channel.
      description: |
        Any of `name`, `url`, `token`, `events` and `paused`; a field left out keeps its value.
        `url` may not be empty. For Slack and Discord the URL is itself the secret and is never
        shown, so leave it out to keep it. `token` is for ntfy only: `""` removes the token.
        The kind never changes.
      tags: [notifications]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationChannelPatch"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationChannel"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/NotificationInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteNotificationChannel
      summary: Remove a notification channel.
      description: Messages stop at once. Its deliveries are removed with it.
      tags: [notifications]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/notifications/channels/{id}/test:
    parameters:
      - $ref: "#/components/parameters/NotificationChannelID"
    post:
      operationId: testNotificationChannel
      summary: Send a sample message to a channel, now.
      description: |
        Sends a `test` event before answering, without queueing it, and records the delivery.
        A receiver that refuses the message or can't be reached is an answer, not an error: the
        response is 200 and the delivery's `status` is `failed`, with the reason in `error`.
        A paused channel can be tested.
      tags: [notifications]
      responses:
        "200":
          description: The delivery, `sent` or `failed`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/notifications/channels/{id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/NotificationChannelID"
    get:
      operationId: listNotificationDeliveries
      summary: List a channel's recent deliveries.
      description: Newest first, at most 20. Older ones are pruned.
      tags: [notifications]
      responses:
        "200":
          description: The deliveries.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NotificationDelivery"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/notifications/channels/{id}/secret:
    parameters:
      - $ref: "#/components/parameters/NotificationChannelID"
    post:
      operationId: rotateNotificationSecret
      summary: Make a new signing secret for a webhook channel.
      description: |
        The old secret stops working at once. The new one is in the answer, this once.
        A channel that isn't a webhook is `409 not_a_webhook`.
      tags: [notifications]
      responses:
        "200":
          description: The new secret.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [signingSecret]
                properties:
                  signingSecret:
                    type: string
                    description: 64 hex digits. Shown only here.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotificationNotFound"
        "409":
          description: The channel isn't a webhook (`not_a_webhook`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/schedules:
    get:
      operationId: listSchedules
      summary: List the schedules, the services' backups among them.
      description: |
        Every schedule of every app, or of one app (`app`, its ID) or project (`project`). An
        app or project that doesn't exist has none: the list is empty, not 404. Each service
        with a backup policy is a built-in schedule here (`builtin: true`, ID
        `backup:<app>:<service>`), read-only: its time and how many are kept change in the
        app's backup policy. Sorted: those whose last run failed first, then those running,
        then by next run, the paused ones last. No schedule holds a run's output.
      tags: [schedules]
      parameters:
        - name: app
          in: query
          description: Only this app's schedules (an app ID). Empty means every app.
          schema: {type: string}
        - name: project
          in: query
          description: Only the schedules of apps in this project. Empty means every project.
          schema: {type: string}
      responses:
        "200":
          description: The schedules.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createSchedule
      summary: Create a schedule.
      description: |
        A schedule runs `command` on its `cron` line (five fields, in UTC) in a fresh copy of
        one service of the app: the live version's image, the service's env and its secret
        values as they are now, no ports and no traffic. The copy ends when the command does,
        or after `stopAfterSeconds`. The clock starts now: the first run is the first slot
        after this moment. A deploy token can't create one (403 `token_scope`): a schedule runs
        any command in the app's containers.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSchedule"
      responses:
        "201":
          description: Created.
          headers:
            Location:
              description: The schedule's URL, `/v1/schedules/{scheduleId}`.
              schema: {type: string}
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleAppNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ScheduleInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/schedules/{scheduleId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    get:
      operationId: getSchedule
      summary: Read one schedule, a built-in one too.
      tags: [schedules]
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "500":
          $ref: "#/components/responses/Internal"
    put:
      operationId: updateSchedule
      summary: Change a schedule.
      description: |
        The body is the whole schedule, as for `createSchedule`: a field left out takes its
        default, it doesn't keep its value. `app` may be left out, and may not name another
        app. A new `cron` takes effect from now: the slots the old line owed are not run. The
        pause and the runs stay. A built-in schedule is 409 `builtin_schedule`.
      tags: [schedules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSchedule"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ScheduleInvalid"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteSchedule
      summary: Remove a schedule and its runs.
      description: |
        A run that is going is stopped first (`stopped`, "the schedule was removed"): its job
        leaves Nomad with its copy of the secrets. When Nomad can't do that, the schedule stays
        and the error says why. A built-in schedule is 409 `builtin_schedule`: remove the
        service's backup policy instead.
      tags: [schedules]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/schedules/{scheduleId}/run:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    post:
      operationId: runSchedule
      summary: Run a schedule once, now.
      description: |
        Whatever its clock says, and while it is paused too. The run goes on in the background:
        follow it with `getScheduleRun`. 409 `run_going` while a run is going and the schedule
        skips overlapping runs (`skipIfRunning`), or while 3 are going; `app_stopped` while the
        app is stopped; `no_live_deployment` when the app has no healthy version to run, or a
        deploy of it is going. A run Nomad refuses is answered 202 too, already
        `could_not_start`, with the reason in `error`.
      tags: [schedules]
      responses:
        "202":
          description: Started (`starting` or `running`), or refused by Nomad (`could_not_start`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/schedules/{scheduleId}/pause:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    post:
      operationId: pauseSchedule
      summary: Pause a schedule's clock.
      description: |
        No slot starts a run while it is paused; runs going go on, and `runSchedule` still
        works. Pausing a paused schedule changes nothing.
      tags: [schedules]
      responses:
        "200":
          description: Paused.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/schedules/{scheduleId}/resume:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    post:
      operationId: resumeSchedule
      summary: Start a paused schedule's clock again.
      description: |
        From now: the slots that passed while it was paused are not run, the next one is
        (`nextRunAt`). Resuming a schedule that isn't paused changes nothing.
      tags: [schedules]
      responses:
        "200":
          description: Resumed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Schedule"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/schedules/{scheduleId}/runs:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
    get:
      operationId: listScheduleRuns
      summary: List a schedule's newest runs, without their output.
      description: |
        Newest first, skipped slots included. A built-in schedule's runs are its service's
        backups (`ok`, `failed` or `running`, the backup's message as `error`).
      tags: [schedules]
      parameters:
        - name: limit
          in: query
          description: How many, 1 to 100; 14 when absent.
          schema: {type: integer, minimum: 1, maximum: 100, default: 14}
      responses:
        "200":
          description: The runs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRunList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "422":
          $ref: "#/components/responses/ScheduleInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/schedules/{scheduleId}/runs/{runId}:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getScheduleRun
      summary: Read one run of a schedule, without its output.
      tags: [schedules]
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/schedules/{scheduleId}/runs/{runId}/stop:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
      - $ref: "#/components/parameters/RunID"
    post:
      operationId: stopScheduleRun
      summary: Stop a run that is going.
      description: |
        The stop is asked: the command gets 10 seconds to end, then the run settles `stopped`
        ("stopped by the owner"). 409 `run_not_running` for a run that has ended;
        `builtin_schedule` for a backup's run.
      tags: [schedules]
      responses:
        "202":
          description: The stop was asked; the run as it is now.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleRun"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/NomadUnavailable"

  /v1/schedules/{scheduleId}/runs/{runId}/output:
    parameters:
      - $ref: "#/components/parameters/ScheduleID"
      - $ref: "#/components/parameters/RunID"
    get:
      operationId: getScheduleRunOutput
      summary: Read what a run printed on one stream.
      description: |
        The last 64 KiB of the stream, with the service's secret values masked
        (`[secret <NAME>]`). This is the only answer that holds a run's output: no schedule,
        run, needs-you item, notification or log line does, and it is sent with
        `Cache-Control: no-store`. 404 `output_not_kept` when there is none to give: the run
        never ran, its output couldn't be read, or it is a backup's run.
      tags: [schedules]
      parameters:
        - name: stream
          in: query
          description: Which stream; `stdout` when absent.
          schema: {type: string, enum: [stdout, stderr], default: stdout}
      responses:
        "200":
          description: The output, which may be empty.
          headers:
            Cache-Control:
              schema: {type: string, const: no-store}
            Caravana-Output-Cut:
              description: "`true` when the start of the stream was dropped to keep its last 64 KiB."
              schema: {type: string, enum: ["true", "false"]}
          content:
            text/plain:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/ScheduleNotFound"
        "422":
          $ref: "#/components/responses/ScheduleInvalid"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/backups:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: listBackups
      summary: List an app's backups still in the destination, and its recent restores.
      tags: [backups]
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    post:
      operationId: createBackup
      summary: Back up one service now.
      description: |
        Starts a backup of a service with a backup policy. It runs in the background: list the
        backups to follow it. 409 `backup_running` while a backup or restore of that service
        runs (for a `volume` backup, also while one runs for another service of the app);
        409 `no_backup_destination` when none is set; 409 `no_running_copy` when a `volume`
        backup finds no running copy to stop. A `volume` backup stops the service for the
        time it takes and starts it again; the job and its version don't change. If the copy
        never picked up the request, the answer is 202 with a record already `failed`, and
        its `message` says why.
      tags: [backups]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [service]
              properties:
                service: {type: string}
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Backup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BackupConflict"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/backups/{backupId}/restore:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: backupId
        in: path
        required: true
        schema: {type: string}
    post:
      operationId: restoreBackup
      summary: Load a backup into its running database, or back into its volumes.
      description: |
        For a database, replaces what the service's database holds with the backup
        (`pg_restore --clean`). Clients connected meanwhile may see errors. For a `volume`
        backup, stops the service, replaces its volumes with the backup's files and starts it
        again; 409 `no_running_copy` when there is no copy to stop. It runs in the
        background: list the backups to follow the restore. One restore per service at a time.
      tags: [backups]
      responses:
        "202":
          description: Started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Restore"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/BackupConflict"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/deployments:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: deployApp
      summary: Save an app and deploy it, or redeploy the stored app.
      description: |
        With a body, the app is validated, saved (replacing the stored app with the same ID)
        and deployed. With an empty body, the stored app is deployed again; an app that has
        no services yet (`defined: false`, made by `createApp` with `deploy=false`) is
        `409 app_not_defined` and nothing is recorded. A body gives it its definition.

        Every image tag is resolved to a digest, the app becomes a new Nomad job version, and
        the response comes back as soon as Nomad has accepted it. Follow the rollout by
        reading the deployment at the `Location` header until its status is final
        (`healthy`, `failed`, `reverted` or `superseded`).

        The same body sent twice leaves the stored app unchanged and creates a new deployment
        and a new job version. When two deploys of one app overlap, the one requested last
        wins and the others end `superseded`.

        With a body, `If-Match` with the `revision` from `getApp` saves only if the stored app
        still has it, else `412 app_changed` and nothing is saved or deployed. Without a body
        the header is ignored: a redeploy changes no definition.

        A body on an app that keeps its Compose file (`composeKept`) drops the file, since the
        file no longer matches the app: the deploy goes on, and the deployment's `warnings`
        say so. Without a body, and for a webhook, the kept file is unchanged.
      tags: [deployments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/OriginCommit"
        - $ref: "#/components/parameters/OriginRef"
        - $ref: "#/components/parameters/OriginActor"
        - $ref: "#/components/parameters/OriginRun"
        - $ref: "#/components/parameters/OriginRepository"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/App"
      responses:
        "202":
          description: |
            Nomad accepted the job and the rollout continues in the background. A deploy that
            a newer request replaced before it reached Nomad also answers 202, with status
            `superseded` and no `jobVersion`. Rarely, Nomad has accepted the job but its
            version isn't known yet; `jobVersion` is then absent and appears on the deployment
            shortly after.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: |
            Empty body, and no app with this ID is stored; or a body with `If-Match`, and no app
            with this ID is stored. Or the ID is new and names a project or environment that
            doesn't exist (`project_not_found` or `environment_not_found`, with `field: "id"`);
            nothing is saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          $ref: "#/components/responses/DeployConflict"
        "412":
          $ref: "#/components/responses/AppChanged"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
    get:
      operationId: listDeployments
      summary: List an app's deployments, newest first.
      tags: [deployments]
      parameters:
        - name: limit
          in: query
          required: false
          description: How many deployments to return, newest first.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The app's newest deployments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getDeployment
      summary: Read one deployment of an app.
      tags: [deployments]
      responses:
        "200":
          description: The deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/TokenScope"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}/compose:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: getDeploymentCompose
      summary: Read the Compose file one deployment was made from.
      description: |
        The request that deployment was made from, as `getCompose` answers it: secret values are
        never returned. A deployment made from an image or a definition has none
        (`composeKept` is false on it), and neither does one from before Caravana kept the file.
      tags: [deployments]
      responses:
        "200":
          description: The request the deployment was made from.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComposeRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: |
            No such app, or no such deployment of this app (`not_found`), or the deployment
            wasn't made from a Compose file (`compose_not_kept`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}/redeploy:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    post:
      operationId: redeployDeployment
      summary: Deploy a past healthy version of the app again.
      description: |
        Deploys what that deployment deployed: its app definition, with each service's image
        pinned by the same digest (tags are not resolved again). The definition becomes the
        stored app, and the new deployment's `source` names the one it came from. It is a new
        deployment and a new Nomad job version, followed like any other (see `deployApp`).

        The Compose file that version was made from becomes the app's kept file again (see
        `getCompose`). A version made from a definition has none, so a kept file is dropped,
        with a warning, as `deployApp` does with a body.

        Secret values are not versioned: the version's secrets keep their current values. A
        secret it uses that has no value now is refused (400 `invalid_field` on
        `services[i].secrets[j].value`). Secrets the stored app has and the version doesn't are
        deleted, with a warning each. A later `deployApp` with an empty body, or a webhook,
        resolves the tags again.
      tags: [deployments]
      responses:
        "202":
          description: Nomad accepted the job; the rollout continues in the background.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `deployment_not_healthy`: only a healthy deployment can be redeployed.
            `definition_not_recorded`: the deployment is from before Caravana saved what each
            deployment deployed. `job_conflict`: as for `deployApp`. `app_not_defined`: the
            app has no services yet (checked first). `app_stopped`: the app is stopped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/promote/preview:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: previewPromotion
      summary: See what promoting the app to another environment would deploy.
      description: |
        `{id}` is the source; `to` names another environment of the same project, where an app
        with the same name must already exist (`copyApp` makes it). Nothing is saved or
        deployed. The answer says, per service, the image the target runs now and the one it
        would run, the digests, and which parts of the service's shape (command, arguments,
        ports, health check, volumes) the promotion replaces with the source's. It also lists
        the warnings the deploy would carry and the target's `targetRevision`, to send back as
        `If-Match` to `promoteApp`.

        It refuses for every reason `promoteApp` does, except a stale `If-Match`, and it asks
        the registry whether each pinned image is still there.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
      responses:
        "200":
          description: What the promotion would do.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PromotionPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PromotionNotFound"
        "409":
          $ref: "#/components/responses/PromotionRefused"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/PromotionInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/promote:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: promoteApp
      summary: Deploy the app's newest healthy version into another environment.
      description: |
        `{id}` is the source, whose newest deployment must be healthy and have a recorded
        definition; `to` names another environment of the same project, where an app with the
        same name must already exist.

        The target runs the images the source's deployment pinned, by the same digests (tags
        are not resolved again), and takes its shape: command, arguments, ports, health check
        and volume mounts. It keeps its own env, secrets (and their values), domains, copies,
        memory and backup settings. A service only the source has is added whole, without
        domains; if it has secrets, the target needs values for them first (`400 invalid_field`
        on `services[i].secrets[j].value`, as for any deploy). A service only the target has
        refuses the promotion (`409 promotion_removes_service`, `field` `services.<name>`).

        It is a new deployment of the target and a new Nomad job version, followed like any
        other (see `deployApp`). The deployment's `promotedFrom` names the source. A target
        that keeps a Compose file loses it, with a warning, as a deploy from a definition
        does. Nothing is saved when it refuses; an image that is gone from its registry is
        refused before anything changes.

        `If-Match` is the target's revision as `previewPromotion` or `getApp` gave it: when
        the target has changed since, `412 app_changed`. Without it, the promotion is built
        from the target as it is when the call arrives, and still refuses if that changes
        before it is saved.
      tags: [deployments]
      parameters:
        - $ref: "#/components/parameters/IfMatch"
        - $ref: "#/components/parameters/OriginCommit"
        - $ref: "#/components/parameters/OriginRef"
        - $ref: "#/components/parameters/OriginActor"
        - $ref: "#/components/parameters/OriginRun"
        - $ref: "#/components/parameters/OriginRepository"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
      responses:
        "202":
          description: Nomad accepted the target's job; the rollout continues in the background.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deployment"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/PromotionNotFound"
        "409":
          $ref: "#/components/responses/PromotionRefused"
        "412":
          $ref: "#/components/responses/AppChanged"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/PromotionInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/apps/{id}/copy:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: copyApp
      summary: Create the app in another environment of its project, without deploying it.
      description: |
        `{id}` is the source; `to` names another environment of the same project. The copy is
        the stored app as it is (services, images, env values, backup settings) without
        domains, and, if the app keeps a Compose file, that file with the overlay's domains
        removed. Secret values were never stored, so the copy has none: `missingSecrets` lists
        each secret it needs a value for, and a deploy is refused until they are set. Webhook
        tokens, backups and the contents of volumes are not copied. Deploy it with `deployApp`
        when it is ready; `promoteApp` updates it afterwards.

        An environment that already has an app of that name is `409 app_exists` with `field`
        `to`.
      tags: [apps]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PromotionRequest"
      responses:
        "201":
          description: Created, not deployed.
          headers:
            Location:
              description: The copy's URL, `/v1/apps/{id}`.
              schema: {type: string}
            ETag:
              $ref: "#/components/headers/AppETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyResult"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          description: |
            No such app (`not_found`), or no such environment in the project
            (`environment_not_found`, `field` `to`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: |
            `app_exists` (`field: "to"`): the environment has an app of this name; promote
            instead.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          description: |
            `invalid_field` with `field` `to`: not a name, or the app's own environment. (A
            copy that would not pass the checks of a deploy, such as an ID too long with the
            place in front of it, is `400 invalid_field` on the field at fault.)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/deployments/{deploymentId}/jobspec:
    parameters:
      - $ref: "#/components/parameters/AppID"
      - name: deploymentId
        in: path
        required: true
        schema:
          type: string
          minLength: 1
    get:
      operationId: exportDeployment
      summary: Export one deployment of the app as a Nomad jobspec.
      description: |
        The Nomad job Caravana registered for that deployment, as HCL, after a comment saying
        what it needs from the cluster (Traefik routing, host volumes, the Nomad Variables
        holding the secrets). It never holds a secret value. `nomad job run` runs it without
        Caravana.
      tags: [deployments]
      responses:
        "200":
          $ref: "#/components/responses/Jobspec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: No such app, or no such deployment of this app.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "`definition_not_recorded`: the deployment is from before Caravana saved what each deployment deployed."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/jobspec:
    parameters:
      - $ref: "#/components/parameters/AppID"
    get:
      operationId: exportApp
      summary: Export the app's live version as a Nomad jobspec.
      description: |
        Like `exportDeployment`, for the app's newest healthy deployment.
      tags: [apps]
      responses:
        "200":
          $ref: "#/components/responses/Jobspec"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            `no_live_deployment`: the app has no healthy deployment yet.
            `definition_not_recorded`: its live deployment is from before Caravana saved what
            each deployment deployed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/apps/{id}/webhook:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: createWebhookToken
      summary: Create or rotate the app's webhook token.
      description: |
        Returns a new token, shown only in this response; any earlier token of this app stops
        working at once. `path` is the webhook path with the token in its query string, ready to
        append to the public base URL of the webhook listener.
      tags: [webhooks]
      responses:
        "201":
          description: The new token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: getWebhook
      summary: Tell whether the app has a webhook token, never the token itself.
      tags: [webhooks]
      responses:
        "200":
          description: The webhook status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
    delete:
      operationId: deleteWebhookToken
      summary: Turn the app's webhook off.
      description: Deletes the token, if any. The webhook then refuses every call for this app.
      tags: [webhooks]
      responses:
        "204":
          description: The app has no webhook token now.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/webhooks/{id}:
    parameters:
      - $ref: "#/components/parameters/AppID"
    post:
      operationId: callWebhook
      summary: Redeploy the stored app, if its images changed.
      description: |
        Authorized by the app's webhook token, in the `token` query parameter or an
        `Authorization: Bearer` header (both present must be equal). Every image is resolved
        again: when every digest equals the app's latest healthy deployment and the stored app
        hasn't changed since, nothing is deployed (200, `changed: false`). Otherwise the stored
        app is redeployed exactly like an empty-body `deployApp`, with trigger `webhook` (202):
        an app created with a definition and never deployed is deployed this way for the first
        time. An app that has no services yet is `409 app_not_defined` and nothing is
        recorded: the webhook never chooses an image, so it can't give an app its definition.

        Any request body is accepted and ignored (up to 1 MiB), whatever its content type.
        Every authorization failure, including an unknown app, gets the same 401.
      tags: [webhooks]
      security:
        - webhookBearer: []
        - webhookQuery: []
      parameters:
        - $ref: "#/components/parameters/OriginCommit"
        - $ref: "#/components/parameters/OriginRef"
        - $ref: "#/components/parameters/OriginActor"
        - $ref: "#/components/parameters/OriginRun"
        - $ref: "#/components/parameters/OriginRepository"
      requestBody:
        required: false
        content:
          "*/*":
            schema: {}
      responses:
        "200":
          description: Nothing changed; the app's live (latest healthy) deployment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "202":
          description: Nomad accepted the redeploy; follow the Location on the main API.
          headers:
            Location:
              $ref: "#/components/headers/DeploymentLocation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebhookResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/DeployConflict"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "422":
          $ref: "#/components/responses/ImageNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/account/password:
    put:
      operationId: changePassword
      summary: Change the admin's password.
      description: |
        Needs the current password. Every session ends except the one making the request, if
        it was made with a session. API tokens keep working. The web account page and
        `caravana admin reset-password` on the host use the same service call.
      tags: [account]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: The password is changed.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens:
    post:
      operationId: createToken
      summary: Create an API token.
      description: |
        Returns a new token, shown only in this response. It grants the whole API, as the
        admin, until it is revoked or its `expiresAt` passes. `name` must be unique among the
        tokens that are still active.

        With a `scope` it is a deploy token for CI: it can only deploy the one app named
        `scope.app` in project `scope.project` (in any of that project's environments), read
        it and its deployments, create it without deploying, and promote it. Everything else is
        `403 token_scope`. The project must exist (`400 invalid_field`, `scope.project`); the
        app, a valid app name, need not exist yet (`scope.app`).
      tags: [tokens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
      responses:
        "201":
          description: The new token.
          headers:
            Location:
              description: The token's URL, `/v1/tokens/{tokenId}`.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "409":
          $ref: "#/components/responses/TokenNameTaken"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "500":
          $ref: "#/components/responses/Internal"
    get:
      operationId: listTokens
      summary: List API tokens, never their values.
      description: Every token, newest first, including expired and revoked ones.
      tags: [tokens]
      responses:
        "200":
          description: The tokens.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/tokens/{tokenId}:
    parameters:
      - $ref: "#/components/parameters/TokenID"
    delete:
      operationId: revokeToken
      summary: Revoke an API token.
      description: |
        The token is refused from now on. It stays in the list as `revoked`. Revoking a token
        that is already revoked changes nothing. A request may revoke the token it is using.
      tags: [tokens]
      responses:
        "204":
          description: The token is revoked.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"

components:
  parameters:
    AppID:
      name: id
      in: path
      required: true
      description: |
        The app ID, a lowercase DNS label. It is also the Nomad job ID. It says where the app
        is: the bare name for an app in project `default`, environment `production`, otherwise
        `<project>--<environment>--<name>`, so `shop--staging--web` is `web` in environment
        `staging` of project `shop`. Project, environment and app names are lowercase labels
        that never hold `--`, so the three parts can always be read back, and clients compute
        the ID from them. Any operation that creates an app (`createApp`, the first `deployApp`
        or `deployCompose` of an unknown ID) places it by this rule, and refuses a project or
        environment that doesn't exist (404 `project_not_found` or `environment_not_found`,
        `field: "id"`) and an ID with `--` that isn't three names (`400 invalid_field`, `id`).
        `default--production--<name>` is refused: that place's ID is the bare name. Apps from
        before projects keep their IDs, even ones with `--`, and sit in `default`/`production`.
        An ID this long plus `-<service>` must fit in 63 characters, so the prefix costs room.
      schema:
        type: string
        pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
      examples:
        whoami:
          value: whoami
        staging:
          value: shop--staging--web
    ProjectName:
      name: project
      in: path
      required: true
      description: The project's name, as `listProjects` returns it.
      schema:
        $ref: "#/components/schemas/Name"
      examples:
        default:
          value: default
    EnvironmentName:
      name: environment
      in: path
      required: true
      description: The environment's name in the project.
      schema:
        $ref: "#/components/schemas/Name"
      examples:
        production:
          value: production
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        One quoted revision, as `getApp` returns it in `ETag` (a weak `W/"…"` tag is treated the
        same). The deploy saves only if the stored app still has this revision, else `412
        app_changed`. A list, an unquoted value or `*` is `400 invalid_field` with `field`
        `If-Match`.
      schema:
        type: string
        examples: ['"0123456789abcdef"']
    OriginCommit:
      name: Caravana-Origin-Commit
      in: header
      required: false
      description: |
        The commit that was built, 7 to 64 hexadecimal digits. Recorded in the deployment's
        `origin`. Any `Caravana-Origin-*` header that breaks its rule, or is sent twice, is
        `422 invalid_field` with `field` naming the header, and nothing is deployed.
      schema:
        type: string
        pattern: "^[0-9a-fA-F]{7,64}$"
        examples: [abc1234def5678]
    OriginRef:
      name: Caravana-Origin-Ref
      in: header
      required: false
      description: The branch or tag, as CI writes it. At most 255 printable characters.
      schema:
        type: string
        maxLength: 255
        examples: [refs/heads/main]
    OriginActor:
      name: Caravana-Origin-Actor
      in: header
      required: false
      description: Who pushed it. At most 100 printable characters.
      schema:
        type: string
        maxLength: 100
        examples: [ana]
    OriginRun:
      name: Caravana-Origin-Run
      in: header
      required: false
      description: The CI run's address; `https://` only, at most 500 characters. The console links it.
      schema:
        type: string
        maxLength: 500
        pattern: "^https://"
        examples: ["https://github.com/acme/shop/actions/runs/212"]
    OriginRepository:
      name: Caravana-Origin-Repository
      in: header
      required: false
      description: The repository, as `owner/name`. At most 200 printable characters.
      schema:
        type: string
        maxLength: 200
        examples: [acme/shop]
    DeployFlag:
      name: deploy
      in: query
      required: false
      description: |
        `true` (the default) saves the app and deploys it. `false` only saves it: no deployment
        is made, and the body may leave the services out (see `createApp`). Anything else is
        `400 invalid_field` with `field` `deploy`.
      schema:
        type: boolean
        default: true
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: |
        Only `*`: create the app only if no app has this ID, else `409 app_exists`. Any other
        value is `400 invalid_field` with `field` `If-None-Match`, as is sending it with
        `If-Match`.
      schema:
        type: string
        enum: ["*"]
    RegistryHost:
      name: host
      in: path
      required: true
      description: |
        The registry host as image names write it, with its port when it has one: `ghcr.io`,
        `registry.example.com:5000`, and `docker.io` for Docker Hub. It is lowercased, and
        `index.docker.io` is `docker.io`.
      schema:
        type: string
      examples:
        ghcr:
          value: ghcr.io
        selfHosted:
          value: registry.example.com:5000
    NotificationChannelID:
      name: id
      in: path
      required: true
      description: The channel's ID, as `listNotificationChannels` returns it.
      schema:
        type: string
        pattern: "^nch_[0-9a-f]{12}$"
    TokenID:
      name: tokenId
      in: path
      required: true
      description: The token's ID, as `listTokens` returns it. Not the token itself.
      schema:
        type: string
        pattern: "^[a-z2-7]{26}$"
    ScheduleID:
      name: scheduleId
      in: path
      required: true
      description: |
        The schedule's ID, as `listSchedules` returns it: 12 hex digits, or
        `backup:<app>:<service>` for a service's backup.
      schema:
        type: string
    RunID:
      name: runId
      in: path
      required: true
      description: The run's ID, as `listScheduleRuns` returns it (a backup's ID for a built-in schedule).
      schema:
        type: string

  securitySchemes:
    apiToken:
      type: http
      scheme: bearer
      description: "An API token as `Authorization: Bearer cvat_…`."
    session:
      type: apiKey
      in: cookie
      name: caravana_session
      description: |
        The web UI's session, set by signing in at `/login`. Over HTTPS the cookie is named
        `__Host-caravana_session`. State-changing requests must come from caravana's own pages.
    webhookBearer:
      type: http
      scheme: bearer
      description: "The app's webhook token as `Authorization: Bearer cvwh_…`."
    webhookQuery:
      type: apiKey
      in: query
      name: token
      description: "The app's webhook token as `?token=cvwh_…`, for senders that only take a URL."

  headers:
    AppETag:
      description: The app's `revision` in quotes, for `If-Match`.
      schema:
        type: string
        examples: ['"0123456789abcdef"']
    AppLocation:
      description: The app's URL, `/v1/apps/{id}`.
      schema:
        type: string
        examples: ["/v1/apps/whoami"]
    DeploymentLocation:
      description: The deployment's URL, `/v1/apps/{id}/deployments/{deploymentId}`.
      schema:
        type: string
        examples: ["/v1/apps/whoami/deployments/k3v7q2x9m4n8p6r5t1w3y7z2ab"]

  schemas:
    Health:
      type: object
      additionalProperties: false
      required: [status, version]
      properties:
        status:
          type: string
          const: ok
        version:
          type: string
          description: |
            The running Caravana's version, e.g. `0.12.0`; `dev` for a build without one. The
            installer waits for it to confirm an upgrade.
          examples: ["0.12.0"]

    App:
      type: object
      additionalProperties: false
      description: |
        One project to deploy. It becomes one Nomad job; each service becomes one task group
        with one task. Images may use tags: they're resolved to digests on every deploy.
      required: [source, services]
      properties:
        id:
          type: string
          description: Optional in a request (taken from the path); if present, must equal it.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          type: string
          description: Display name and Nomad job name. Empty means the ID.
        source:
          type: object
          additionalProperties: false
          required: [kind]
          properties:
            kind:
              type: string
              enum: [image, compose]
              description: |
                Which input the app came from. `compose` is set by `deployCompose`; both kinds
                deploy the same way.
        services:
          type: array
          description: |
            At least one service to deploy. Only an app read back after `createApp` with
            `deploy=false` can have none (`defined: false`).
          items:
            $ref: "#/components/schemas/Service"
      examples:
        - id: whoami
          source: {kind: image}
          services:
            - name: web
              image: traefik/whoami:latest
              ports: [{name: http, containerPort: 80}]
              domains: [{host: whoami.localhost, port: http}]
              health: {path: /, interval: 10s, timeout: 2s}

    Service:
      type: object
      additionalProperties: false
      required: [name, image]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        image:
          type: string
          description: |
            A Docker Hub or GHCR image: `traefik/whoami:latest`, `nginx`,
            `ghcr.io/owner/repo:tag`, or a reference pinned by digest. No tag means `latest`.
        entrypoint:
          type: array
          maxItems: 64
          items: {type: string, minLength: 1, maxLength: 4096}
          description: |
            Replaces the image's entrypoint: the program and its first arguments, in full.
            `command` and `args` follow it. Empty keeps the image's entrypoint.
        command:
          type: string
        args:
          type: array
          items: {type: string}
        env:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name]
            properties:
              name: {type: string, minLength: 1}
              value: {type: string}
        secrets:
          type: array
          description: |
            The service's secrets, as environment variables. Each deploy replaces the whole
            list: a name you leave out is removed. Send `value` to set a secret; leave it out to
            keep the value it has now. Values are write-only: responses list names only. An
            app's secrets hold at most 61440 bytes in total.
          items:
            $ref: "#/components/schemas/Secret"
        volumes:
          type: array
          description: |
            Directories that keep their data across deploys, each mounted by this service only.
            A service with a volume runs one copy (`replicas` absent or 1), and its deploys stop
            the old copy before starting the new one. A volume is created on the first deploy
            that names it and deleted with the app.
          items:
            $ref: "#/components/schemas/Volume"
        backup:
          $ref: "#/components/schemas/BackupPolicy"
        ports:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [name, containerPort]
            properties:
              name:
                type: string
                pattern: "^[a-z][a-z0-9_]{0,62}$"
              containerPort:
                type: integer
                minimum: 1
                maximum: 65535
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host, port]
            properties:
              host: {type: string}
              port:
                type: string
                description: The name of a port declared on this service.
        replicas:
          type: integer
          minimum: 1
          description: Leave it out for 1.
        resources:
          type: object
          additionalProperties: false
          properties:
            cpuMHz: {type: integer, minimum: 0}
            memoryMB:
              type: integer
              minimum: 0
              description: |
                Memory reserved for the service, in MB: the scheduler counts it. 0 means the
                installation's default (256 unless configured), lowered to `memoryMaxMB` when only
                that is set.
            memoryMaxMB:
              type: integer
              minimum: 0
              description: |
                The most memory the service may use while the node has it spare, in MB; past it the
                copy is restarted. At least `memoryMB`. 0 means the larger of the reservation and
                the installation's default (1024 unless configured). When the cluster doesn't allow
                memory oversubscription, Nomad ignores it and the deployment's warnings say so.
        health:
          type: object
          additionalProperties: false
          description: Required when the service has ports, not allowed when it has none.
          properties:
            path:
              type: string
              description: Makes it an HTTP check on this path. Empty means a TCP check.
            port:
              type: string
            interval:
              $ref: "#/components/schemas/Duration"
            timeout:
              $ref: "#/components/schemas/Duration"

    Volume:
      type: object
      additionalProperties: false
      required: [name, path]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
          description: Unique across the app.
        path:
          type: string
          description: Where the service sees it. An absolute, clean path, not `/`.
          examples: ["/var/lib/postgresql/data"]
        readOnly:
          type: boolean

    ComposeRequest:
      type: object
      additionalProperties: false
      required: [compose]
      properties:
        compose:
          type: string
          maxLength: 524288
          description: The Compose file, as `docker compose up` would read it.
        name:
          type: string
          description: Display name of the app. Empty means the ID.
        services:
          type: object
          description: What Compose has no words for, per service of the file (by its name).
          additionalProperties:
            $ref: "#/components/schemas/ComposeOverlay"
      examples:
        - compose: |
            services:
              web:
                image: traefik/whoami
                ports: ["80"]
          services:
            web:
              domains: [{host: whoami.localhost}]

    ComposeOverlay:
      type: object
      additionalProperties: false
      properties:
        domains:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [host]
            properties:
              host: {type: string}
              port:
                type: integer
                minimum: 1
                maximum: 65535
                description: The container port the domain routes to. Optional when the service has one port.
        health:
          type: object
          additionalProperties: false
          description: |
            The check Nomad runs. Without it, a service with ports is checked over TCP on its
            first port.
          properties:
            path:
              type: string
              description: Makes it an HTTP check on this path. Empty means a TCP check.
            port:
              type: integer
              minimum: 1
              maximum: 65535
              description: The container port to check. Optional when the service has one port.
            interval:
              $ref: "#/components/schemas/Duration"
            timeout:
              $ref: "#/components/schemas/Duration"
        secrets:
          type: array
          description: The service's secrets, with the meaning `Service.secrets` has.
          items:
            $ref: "#/components/schemas/Secret"
        backup:
          $ref: "#/components/schemas/BackupPolicy"

    BackupPolicy:
      type: object
      additionalProperties: false
      required: [engine]
      description: |
        Makes Caravana back the service up to the backup destination.

        `postgres`: the service is a database. It needs ports and `POSTGRES_PASSWORD` in its
        env or secrets.

        `volume`: the service's volumes are archived while the service is stopped, for a few
        seconds. The service must mount a volume (else the deploy is refused with 400
        `invalid_field` on `services[i].backup.engine`), and its schedule must be a cron
        expression Caravana can run. Every volume belongs to one service, so no other service
        shares the one that is archived, and no service is named `caravana-volumes`.
      properties:
        engine:
          type: string
          enum: [postgres, volume]
        schedule:
          type: string
          description: Five-field cron, in UTC. Leave it out for `0 3 * * *`.
        keep:
          type: integer
          minimum: 1
          maximum: 100
          description: How many backups stay. Leave it out for 7.

    BackupDestination:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, prefix, accessKeyId, updatedAt]
      properties:
        endpoint: {type: string, examples: ["https://s3.eu-west-1.amazonaws.com"]}
        region: {type: string}
        bucket: {type: string}
        prefix: {type: string}
        accessKeyId: {type: string}
        updatedAt: {type: string, format: date-time}

    BackupDestinationRequest:
      type: object
      additionalProperties: false
      required: [endpoint, region, bucket, accessKeyId]
      properties:
        endpoint: {type: string}
        region: {type: string}
        bucket: {type: string}
        prefix: {type: string}
        accessKeyId: {type: string}
        secretAccessKey:
          type: string
          writeOnly: true

    Registry:
      type: object
      additionalProperties: false
      required: [host, username, createdAt, updatedAt]
      properties:
        host:
          type: string
          description: The canonical host, lowercase, with its port; `docker.io` for Docker Hub.
          examples: [ghcr.io]
        username: {type: string}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        lastTest:
          type: object
          additionalProperties: false
          required: [at, ok]
          description: The last `testRegistry`. Absent until the first test, and after a save that changes the credentials.
          properties:
            at: {type: string, format: date-time}
            ok:
              type: boolean
              description: True when the registry accepted the credentials.
            message:
              type: string
              description: Why the registry refused them or couldn't be reached. Absent when `ok`.

    NotificationChannel:
      type: object
      additionalProperties: false
      required: [id, kind, name, address, events, paused, hasToken, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^nch_[0-9a-f]{12}$"
        kind:
          type: string
          enum: [webhook, slack, discord, ntfy]
        name: {type: string}
        address:
          type: string
          description: |
            What the console shows. A webhook's URL and an ntfy topic URL are shown whole. A Slack
            or Discord incoming-webhook URL is itself the secret, so only the host and the start
            of the path remain, for example `hooks.slack.com/services/T…/••••`.
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEventName"
        paused:
          type: boolean
        hasToken:
          type: boolean
          description: True when an ntfy channel has an access token. The token is never returned.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    NotificationChannelCreated:
      description: |
        A channel as `createNotificationChannel` answers: the channel, and for a webhook its
        `signingSecret`, shown only here.
      type: object
      additionalProperties: false
      required: [id, kind, name, address, events, paused, hasToken, createdAt, updatedAt]
      properties:
        id:
          type: string
          pattern: "^nch_[0-9a-f]{12}$"
        kind:
          type: string
          enum: [webhook, slack, discord, ntfy]
        name: {type: string}
        address: {type: string, description: "As in `NotificationChannel`."}
        events:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEventName"
        paused:
          type: boolean
        hasToken:
          type: boolean
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        signingSecret:
          type: string
          description: 64 hex digits. Present for a `webhook` channel only. It is not shown again.

    NotificationEventName:
      type: string
      enum: [problems, deploy_failed, deploy_succeeded]
      description: |
        What a channel asks for: `problems` (a needs-you item opening, and being resolved),
        `deploy_failed` (a deploy ended failed, reverted or superseded) and `deploy_succeeded`
        (a deploy ended healthy).

    NotificationChannelInput:
      type: object
      additionalProperties: false
      required: [kind, name, url, events]
      properties:
        kind:
          type: string
          enum: [webhook, slack, discord, ntfy]
        name: {type: string, minLength: 1, maxLength: 80}
        url:
          type: string
          description: |
            An absolute http or https URL: where a webhook is posted, the Slack or Discord
            incoming-webhook URL, or the ntfy topic URL such as `https://ntfy.sh/my-topic`. A
            webhook or ntfy URL may not hold a user name and password.
        token:
          type: string
          writeOnly: true
          description: "ntfy only, and optional: the access token of a protected topic."
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NotificationEventName"
        paused:
          type: boolean
          default: false

    NotificationChannelPatch:
      type: object
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        url:
          type: string
          minLength: 1
          description: Leave it out to keep the address; for Slack and Discord that is the only way, since it is a secret.
        token:
          type: string
          writeOnly: true
          description: ntfy only. `""` removes the token; leave it out to keep it.
        events:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/NotificationEventName"
        paused:
          type: boolean

    NotificationDelivery:
      type: object
      additionalProperties: false
      required: [id, eventType, title, status, attempts, createdAt]
      properties:
        id:
          type: string
          pattern: "^ndl_[0-9a-f]{12}$"
        eventType:
          $ref: "#/components/schemas/NotificationEventType"
        title: {type: string}
        status:
          type: string
          enum: [pending, sent, failed]
          description: |
            `pending` is queued or waiting for a retry (after 30 seconds, then 2 minutes);
            `failed` means it gave up after 3 attempts, or the channel went away.
        attempts: {type: integer}
        error:
          type: string
          description: Why the last attempt failed, with the receiver's status. Never the address.
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}

    NotificationEventType:
      type: string
      enum: [problem.opened, problem.resolved, deploy.succeeded, deploy.failed, test]

    NotificationEvent:
      description: |
        The JSON a **webhook** channel receives: `POST <url>` with `Content-Type:
        application/json`. Slack, Discord and ntfy channels get the same event as a short text
        message instead. This is a document for receivers; no endpoint of this API takes or
        returns it.

        Headers:
        - `Caravana-Event`: the `type`;
        - `Caravana-Delivery`: the `id`;
        - `Caravana-Signature`: `t=<unix seconds>,v1=<hex>`, where `v1` is the HMAC-SHA256, under
          the channel's signing secret, of the string `"<t>.<raw body>"`.

        A receiver should compute that over the raw body bytes, compare in constant time, and
        reject a `t` more than 5 minutes from its own clock. Any 2xx answer means accepted;
        anything else is retried twice more, after 30 seconds and 2 minutes.
      type: object
      additionalProperties: false
      required: [id, type, title, text, at]
      properties:
        id:
          type: string
          description: The delivery's ID. A retry sends the same one.
          examples: [ndl_3f9a1c2b4d5e]
        type:
          $ref: "#/components/schemas/NotificationEventType"
        kind:
          type: string
          description: |
            For problems, what the needs-you list calls it (`AttentionItem.kind`), such as
            `deploy_failed`, `backup_failed`, `restarting`, `out_of_memory`, `schedule_failed`
            (a schedule's latest run failed), `schedule_skipping` (its last 3 slots were
            skipped), `domain_dns_elsewhere` (a domain's DNS points at another host) or
            `domain_cert_expiring` (a domain's certificate is near its end and not renewed). A
            schedule that keeps failing is one problem: one `problem.opened`, then one
            `problem.resolved` after a run succeeds; so is a domain, per host. Receivers should
            accept kinds they don't know.
        app:
          type: string
          description: The app's ID. Absent for installation-wide events.
        project:
          type: string
          description: The project of the app. Absent when `app` is.
        environment:
          type: string
          description: The environment of the app, such as `staging`. Absent when `app` is.
        appName:
          type: string
          description: The app's name in its environment. Absent when `app` is.
        service: {type: string}
        title:
          type: string
          examples: ["kuma: the backup of uptime-kuma failed"]
        text:
          type: string
          description: What happened, in plain words.
        detail:
          type: string
          description: The raw reason, as Nomad, the registry or the backup tool said it.
        deployment:
          type: string
          description: "Deploy events only: the deployment's ID."
        version:
          type: integer
          description: "Deploy events only: the Nomad job version, once registered."
        outcome:
          type: string
          enum: [healthy, failed, reverted, superseded]
          description: Deploy events only.
        trigger:
          type: string
          description: |
            Deploy events only: what started the deployment, as the deployment record says it:
            `console` (the web console), `manual` (an API call) or `webhook`. Receivers should
            accept values they don't know.
        promotedFrom:
          type: string
          description: |
            Deploy events only, for a deployment made by promoting another environment's
            (`promoteApp`): the name of the environment it came from. The `text` says so too.
            Absent otherwise.
        origin:
          $ref: "#/components/schemas/Origin"
          description: Deploy events only, for a deploy whose caller said where it came from (a CI run).
        schedule:
          type: string
          description: |
            `problem.opened` of `schedule_failed` and `schedule_skipping` only: the schedule's
            name. A run's output is never in a message; read it with `getScheduleRunOutput`.
        exitCode:
          type: integer
          description: |
            `problem.opened` of `schedule_failed` only, when the run exited with a code (not
            when it was stopped at its limit or couldn't start). Absent otherwise.
        domain:
          type: string
          description: "`problem.opened` of the domain kinds: the host."
        addressSeen:
          type: string
          description: |
            `problem.opened` of `domain_dns_elsewhere`: the address the domain's DNS gave that
            isn't this host's.
        expiresAt:
          type: string
          format: date-time
          description: "`problem.opened` of `domain_cert_expiring`: when the certificate ends."
        url:
          type: string
          description: |
            The console page about it (for a schedule, the Schedules page at that schedule; for
            a domain, the Domains page with it open).
            Absent when Caravana doesn't know its own address (`CARAVANA_PUBLIC_URL`).
        at: {type: string, format: date-time}

    RegistryRequest:
      type: object
      additionalProperties: false
      required: [username]
      properties:
        username: {type: string, minLength: 1}
        password:
          type: string
          writeOnly: true
          minLength: 1
          description: |
            The password or token. Required when creating; leave it out to keep the stored one.
            An empty string is `422 invalid_field`.

    Backup:
      type: object
      additionalProperties: false
      required: [id, service, engine, status, bytes, startedAt]
      properties:
        id: {type: string, examples: ["db-1791386036"]}
        service: {type: string}
        engine:
          type: string
          enum: [postgres, volume]
        status:
          type: string
          enum: [running, succeeded, failed]
        bytes:
          type: integer
          description: The dump's size, or for a `volume` backup the sum of its archives.
        message:
          type: string
          description: |
            Why it failed, as the dump or the upload said. A succeeded `volume` backup may
            carry a warning here, for instance that retention couldn't remove an old backup.
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        stoppedSeconds:
          type: number
          description: |
            `volume` backups only: how long the service was stopped, once measured. Absent
            while the run is going, and when Caravana couldn't measure it.
        volumes:
          type: array
          description: "`volume` backups only: one archive per volume."
          items:
            $ref: "#/components/schemas/BackupVolume"

    BackupVolume:
      type: object
      additionalProperties: false
      required: [name, bytes, sizeBytes]
      properties:
        name: {type: string}
        bytes:
          type: integer
          description: The archive's size in the destination.
        sizeBytes:
          type: integer
          description: The volume's data when it was archived, before compression.

    AppVolume:
      type: object
      additionalProperties: false
      required: [name, mounted, mounts, backedUp]
      properties:
        name: {type: string, examples: ["uptime-kuma-db-data"]}
        mounted:
          type: boolean
          description: |
            False for a volume Nomad has for the app that no service mounts; `mounts` is then
            empty.
        mounts:
          type: array
          items:
            $ref: "#/components/schemas/AppVolumeMount"
        hostPath:
          type: string
          description: |
            The directory on the node that holds the volume's files. Absent when Nomad couldn't
            be read.
        size:
          $ref: "#/components/schemas/AppVolumeSize"
        backedUp:
          type: boolean
          description: |
            True when the service that mounts the volume has a `volume` backup. A volume of a
            `postgres`-backed service is not backed up in this sense.
        lastBackup:
          $ref: "#/components/schemas/AppVolumeBackup"

    AppVolumeMount:
      type: object
      additionalProperties: false
      required: [service, path, readOnly]
      properties:
        service: {type: string}
        path: {type: string}
        readOnly: {type: boolean}

    AppVolumeSize:
      type: object
      description: Absent from an `AppVolume` that has never been measured.
      additionalProperties: false
      required: [bytes, measuredAt]
      properties:
        bytes: {type: integer}
        measuredAt:
          type: string
          format: date-time
          description: When the copy's `caravana-volumes` task measured it.

    AppVolumeBackup:
      type: object
      description: |
        The newest `volume` backup of the service that mounts the volume, whatever its outcome.
        Absent when `backedUp` is false, and until the first backup ran.
      additionalProperties: false
      required: [id, status, startedAt]
      properties:
        id: {type: string, examples: ["uptime-kuma-1792119600"]}
        status:
          type: string
          enum: [running, succeeded, failed]
        startedAt: {type: string, format: date-time}

    Restore:
      type: object
      additionalProperties: false
      required: [id, service, backupId, engine, status, createdAt]
      properties:
        id: {type: string}
        service: {type: string}
        backupId: {type: string}
        engine:
          type: string
          enum: [postgres, volume]
        status:
          type: string
          enum: [running, succeeded, failed]
        message: {type: string}
        createdAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}
        stoppedSeconds:
          type: number
          description: "`volume` restores only: how long the service was stopped, once measured."

    BackupList:
      type: object
      additionalProperties: false
      required: [backups, restores]
      properties:
        backups:
          type: array
          items:
            $ref: "#/components/schemas/Backup"
        restores:
          type: array
          items:
            $ref: "#/components/schemas/Restore"

    ComposePreview:
      type: object
      additionalProperties: false
      required: [app, warnings]
      properties:
        app:
          $ref: "#/components/schemas/App"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"

    Secret:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          description: Unique across the service's secrets and env.
        value:
          type: string
          writeOnly: true
          description: |
            UTF-8 text without NUL. Leave it out to keep the value the secret has now. Never
            returned.

    Duration:
      type: string
      description: A Go duration string, e.g. `"10s"` or `"1m30s"`.
      pattern: "^([0-9]+(\\.[0-9]+)?(ns|us|µs|ms|s|m|h))+$"
      examples: ["10s"]

    NewSchedule:
      type: object
      additionalProperties: false
      required: [app, name, command, cron]
      description: A schedule as `createSchedule` takes it, and, whole, as `updateSchedule` does.
      properties:
        app:
          type: string
          description: The app's ID. The app must be defined (have services).
        service:
          type: string
          description: |
            The service whose image, env and secrets a run uses; the app's first when absent. It
            may not mount a volume.
        name:
          type: string
          maxLength: 31
          description: A lowercase DNS label, unique in the app.
          examples: [rates-sync]
        command:
          type: array
          minItems: 1
          maxItems: 64
          items: {type: string}
          description: |
            The program, then its arguments. No shell is implied: use `["sh", "-c", "..."]`
            for pipes or variables.
          examples: [["bin/rails", "rates:sync"]]
        cron:
          type: string
          description: |
            Five fields (minute, hour, day of month, month, day of week), read as UTC. A line
            that fires more than once a minute, or never, is refused.
          examples: ["0 3 * * *"]
        stopAfterSeconds:
          type: integer
          enum: [300, 1800, 3600, 7200]
          default: 1800
          description: A run still going after this long is stopped (`stopped_at_limit`).
        memoryMB:
          type: integer
          enum: [256, 512, 1024, 2048]
          description: The run's memory; when absent, the service's reservation rounded up to one of these.
        skipIfRunning:
          type: boolean
          default: true
          description: |
            True: a slot that comes while a run is going is skipped. False: runs may overlap, at
            most 3 at once.

    Schedule:
      type: object
      additionalProperties: false
      required: [id, app, service, name, command, cron, stopAfterSeconds, memoryMB, skipIfRunning, words,
        paused, pausedAt, builtin, nextRunAt, lastRun, runningNow, usualSeconds, project, environment, appName]
      description: |
        A schedule, with what is derived from its clock and its runs on every read. A built-in
        schedule (`builtin: true`) is a service's backup policy: its `command` is empty and its
        `stopAfterSeconds` and `memoryMB` are 0, since the backup sets its own. It is changed in
        the app's backup policy; every change here is 409 `builtin_schedule`. Never holds a
        run's output.
      properties:
        id:
          type: string
          description: 12 hex digits, or `backup:<app>:<service>` for a built-in schedule.
          examples: [3f9a1c2b4d5e, "backup:hollo:db"]
        app: {type: string, description: The app's ID.}
        service: {type: string}
        name: {type: string, description: "A built-in schedule's is `<service>-backup`."}
        command:
          type: array
          items: {type: string}
        cron: {type: string}
        stopAfterSeconds: {type: integer, description: "300, 1800, 3600 or 7200; 0 for a built-in schedule."}
        memoryMB: {type: integer, description: "256, 512, 1024 or 2048; 0 for a built-in schedule."}
        skipIfRunning: {type: boolean}
        words:
          type: string
          description: The cron line in words.
          examples: ["Every day at 03:00 UTC"]
        paused: {type: boolean}
        pausedAt: {type: [string, "null"], format: date-time}
        builtin: {type: boolean}
        nextRunAt:
          type: [string, "null"]
          format: date-time
          description: Null while paused, and for a built-in schedule while its app is stopped.
        lastRun:
          description: The newest run that wasn't a skipped slot; null for none.
          oneOf:
            - $ref: "#/components/schemas/ScheduleRun"
            - type: "null"
        runningNow: {type: integer, minimum: 0, description: How many runs are going.}
        usualSeconds:
          type: [integer, "null"]
          description: The median duration of the `ok` runs among the newest 14; null when there are none.
        project: {type: string}
        environment: {type: string}
        appName: {type: string}

    ScheduleList:
      type: object
      additionalProperties: false
      required: [schedules]
      properties:
        schedules:
          type: array
          items:
            $ref: "#/components/schemas/Schedule"

    ScheduleRun:
      type: object
      additionalProperties: false
      required: [id, scheduleId, trigger, slotAt, status, exitCode, error, startedAt, taskStartedAt, finishedAt,
        durationSeconds, command, deploymentId, jobVersion, outputKept, stdoutBytes, stderrBytes, stdoutCut,
        stderrCut]
      description: |
        One run of a schedule, or one slot that was skipped. Never holds the output, which only
        `getScheduleRunOutput` returns.
      properties:
        id: {type: string}
        scheduleId: {type: string}
        trigger:
          type: string
          enum: [timer, owner]
          description: "`timer`: a slot of the cron line. `owner`: `runSchedule`."
        slotAt:
          type: [string, "null"]
          format: date-time
          description: The cron slot a `timer` run answers; null for an `owner` run.
        status:
          type: string
          enum: [starting, running, ok, failed, stopped_at_limit, stopped, skipped, could_not_start]
          description: |
            `starting` until Nomad accepts the run's job, then `running`. It ends `ok` (exit
            0), `failed` (another exit code, out of memory, stopped outside Caravana, lost),
            `stopped_at_limit`, `stopped` (by the owner, by stopping the app, or by removing the
            schedule) or `could_not_start`. `skipped` is a slot that didn't run because a run
            was going.
        exitCode: {type: [integer, "null"]}
        error:
          type: string
          description: Why, in Caravana's words (`exit 3`, `stopped after 5 minutes`); empty when `ok`. Never the output.
        startedAt: {type: string, format: date-time}
        taskStartedAt: {type: [string, "null"], format: date-time}
        finishedAt: {type: [string, "null"], format: date-time}
        durationSeconds:
          type: [integer, "null"]
          description: From the command's start to the run's end; null while it goes and for a skipped slot.
        command:
          type: array
          items: {type: string}
          description: The command as the run ran it; empty for a backup's run.
        deploymentId:
          type: [string, "null"]
          description: The deployment whose image the run used.
        jobVersion: {type: [integer, "null"]}
        outputKept:
          type: boolean
          description: "`getScheduleRunOutput` has the output (never for a backup's run)."
        stdoutBytes: {type: integer, minimum: 0}
        stderrBytes: {type: integer, minimum: 0}
        stdoutCut:
          type: boolean
          description: The start of stdout was dropped to keep its last 64 KiB.
        stderrCut: {type: boolean}

    ScheduleRunList:
      type: object
      additionalProperties: false
      required: [runs]
      properties:
        runs:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/ScheduleRun"

    NewApp:
      type: object
      additionalProperties: false
      description: |
        The body of `createApp`. With `deploy` true or absent it is an `App` (`source` and at
        least one service). With `deploy=false` only `id` is needed: `name` is optional, and
        `source` and `services` may be left out for an app that has no definition yet. A
        `services` that is sent is checked as a deploy checks it, and its secrets list names
        only.
      required: [id]
      properties:
        id:
          type: string
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          $ref: "#/components/schemas/App/properties/name"
        source:
          $ref: "#/components/schemas/App/properties/source"
        services:
          type: array
          items:
            $ref: "#/components/schemas/Service"

    AppRecord:
      type: object
      additionalProperties: false
      required: [app, createdAt, updatedAt, revision, composeKept, defined, project, environment, appName]
      properties:
        app:
          $ref: "#/components/schemas/App"
        project: {$ref: "#/components/schemas/PlaceProject"}
        environment: {$ref: "#/components/schemas/PlaceEnvironment"}
        appName: {$ref: "#/components/schemas/PlaceAppName"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        revision:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: |
            Names this exact stored definition and the Compose file kept with it: it changes
            whenever the app is saved with a change (a comment-only edit of the file counts),
            and stays the same when it is saved unchanged. Send it as `If-Match` to deploy only
            if the app is still as you read it.
          examples: ["0123456789abcdef"]
        composeKept:
          type: boolean
          description: The app keeps the Compose file it was deployed from; `getCompose` answers 200.
        defined:
          $ref: "#/components/schemas/AppDefined"
        stoppedAt:
          $ref: "#/components/schemas/AppStoppedAt"

    AppStoppedAt:
      type: string
      format: date-time
      description: |
        When the owner stopped the app (`stopApp`). Absent while it isn't stopped. A stopped app
        refuses every deploy with 409 `app_stopped`.

    AppDefined:
      type: boolean
      description: |
        The app has services to deploy. `false` for an app created without a definition
        (`createApp` with `deploy=false`): it is listed and can have a webhook token, but a
        redeploy as stored is `409 app_not_defined` until a deploy brings services.

    AppSummary:
      type: object
      additionalProperties: false
      required: [app, createdAt, updatedAt, composeKept, defined, project, environment, appName, status]
      properties:
        app:
          $ref: "#/components/schemas/App"
        project: {$ref: "#/components/schemas/PlaceProject"}
        environment: {$ref: "#/components/schemas/PlaceEnvironment"}
        appName: {$ref: "#/components/schemas/PlaceAppName"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        composeKept:
          type: boolean
          description: The app keeps the Compose file it was deployed from; `getCompose` answers 200.
        defined:
          $ref: "#/components/schemas/AppDefined"
        stoppedAt:
          $ref: "#/components/schemas/AppStoppedAt"
        status:
          $ref: "#/components/schemas/AppStatus"
        lastDeployment:
          $ref: "#/components/schemas/Deployment"

    AppSummaryList:
      type: object
      additionalProperties: false
      required: [apps]
      properties:
        apps:
          type: array
          items:
            $ref: "#/components/schemas/AppSummary"

    Name:
      type: string
      description: |
        A project, environment or app name: a lowercase DNS label (letters a-z, digits and
        single dashes, not starting or ending with one, at most 63 characters) that never holds
        `--`, which separates the parts of an app ID.
      pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      maxLength: 63
      examples: [shop]

    PlaceProject:
      type: string
      description: The project the app is in (`default` for an app from before projects).
      examples: [shop]

    PlaceEnvironment:
      type: string
      description: The environment of the project the app is in (`production` for an app from before projects).
      examples: [staging]

    PlaceAppName:
      type: string
      description: |
        The app's name in its environment. The app's ID is `appName` in `default`/`production`,
        else `<project>--<environment>--<appName>`. For an app from before projects whose ID
        held `--`, the whole ID.
      examples: [web]

    Environment:
      type: object
      additionalProperties: false
      required: [project, name, position, apps]
      properties:
        project: {type: string, description: "The project's name."}
        name: {type: string}
        position:
          type: integer
          minimum: 0
          description: "The order environments are shown in; a project's `production` is 0, later ones follow."
        apps:
          type: integer
          minimum: 0
          description: How many apps are in it now.

    Project:
      type: object
      additionalProperties: false
      required: [name, displayName, environments, createdAt, updatedAt]
      properties:
        name:
          type: string
          description: "The project's name, the first part of its apps' IDs. It never changes."
        displayName:
          type: string
          description: What the console shows. 1 to 100 printable characters.
        environments:
          type: array
          description: In the order shown, `production` first unless it was deleted.
          items:
            $ref: "#/components/schemas/Environment"
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}

    ProjectRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"
        displayName:
          type: string
          minLength: 1
          maxLength: 100
          description: Defaults to `name`. Anything printable, not only spaces.

    ProjectUpdate:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100

    EnvironmentRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          $ref: "#/components/schemas/Name"

    EnvironmentAppRequest:
      type: object
      additionalProperties: false
      description: |
        An `App`, plus the name it takes in the environment. `id` may be left out; when given it
        must equal the ID the project, environment and `appName` make. As for `NewApp`, `source`
        and `services` may be left out only with `deploy=false`.
      required: [appName]
      properties:
        appName:
          $ref: "#/components/schemas/Name"
        id:
          type: string
          description: Optional; if present, must equal the ID of this place.
          pattern: "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$"
        name:
          $ref: "#/components/schemas/App/properties/name"
        source:
          $ref: "#/components/schemas/App/properties/source"
        services:
          $ref: "#/components/schemas/NewApp/properties/services"

    AppStatus:
      type: object
      additionalProperties: false
      required: [state, wantedCopies, healthyCopies]
      properties:
        state:
          type: string
          enum: [rolling_out, healthy, degraded, not_running, unknown, stopped]
          description: |
            `stopped`: the owner stopped the app (`stopApp`); it wins over every other state.
        wantedCopies: {type: integer, minimum: 0}
        healthyCopies: {type: integer, minimum: 0}
        liveVersion:
          type: integer
          minimum: 0
          description: The job version the healthy copies run. Absent when no copy is healthy.
        services:
          type: array
          description: |
            The same two counts per service, in the app's service order, so a client can say which
            service is short. Absent for an app with no services.
          items:
            $ref: "#/components/schemas/ServiceStatus"

    ServiceStatus:
      type: object
      additionalProperties: false
      required: [name, wantedCopies, healthyCopies]
      properties:
        name: {type: string}
        wantedCopies: {type: integer, minimum: 0}
        healthyCopies: {type: integer, minimum: 0, description: Healthy copies of the live version.}

    AppAction:
      type: object
      additionalProperties: false
      required: [id, action, trigger, status, startedAt]
      description: |
        One action on an app. Never holds command output or arguments.
      properties:
        id: {type: string}
        action:
          type: string
          enum: [stop, start, restart, run, terminal]
        trigger:
          type: string
          enum: [manual, console]
          description: How it was asked for. `manual` is the API; `console` is the web console.
        status:
          type: string
          enum: [running, succeeded, failed]
          description: |
            A `run` is `succeeded` once the command ran to an exit (whatever its exit code), and
            `failed` when it timed out or couldn't start. A restart interrupted by Caravana
            restarting is `failed`. A `terminal` is `succeeded` when the shell exited or the
            user closed it (`error` is `closed` for that), and `failed` when it ended idle,
            at the time limit, with a lost connection, or because the shell couldn't start.
        copyId:
          type: string
          description: "`run` and `terminal` only: the copy the command or shell ran in."
        service:
          type: string
          description: "`run` and `terminal` only: the copy's service."
        program:
          type: string
          description: |
            `run`: the command's first word, nothing else. `terminal`: the shell asked for
            (`auto`, `bash` or `sh`).
        exitCode:
          type: integer
          description: |
            `run` and `terminal` only: absent when the command timed out or didn't start, or the
            shell didn't exit with one.
        error:
          type: string
          description: |
            Why a failed action failed, in Caravana's words; never command output. For a
            `terminal`, how it ended when the shell didn't exit: `idle for 15 minutes`,
            `open for 60 minutes`, `connection lost`, `closed`, or a fixed sentence.
        startedAt: {type: string, format: date-time}
        finishedAt: {type: string, format: date-time}

    CommandResult:
      type: object
      additionalProperties: false
      required: [stdout, stderr, stdoutTruncated, stderrTruncated, timedOut, failedToStart]
      description: |
        What one command did. Shown in the answer to `runCommand` and nowhere else.
      properties:
        exitCode:
          type: integer
          description: The program's exit status. Absent when it timed out or didn't start.
        stdout:
          type: string
          description: The first 64 KiB of the program's standard output.
        stderr:
          type: string
          description: |
            The first 64 KiB of its standard error. When `failedToStart`, Nomad's reason.
        stdoutTruncated: {type: boolean}
        stderrTruncated: {type: boolean}
        timedOut:
          type: boolean
          description: It ran longer than 60 seconds and was stopped.
        failedToStart:
          type: boolean
          description: The program couldn't be started (it isn't in the image, say).

    Copy:
      type: object
      additionalProperties: false
      required: [id, service, node, version, status, restarts, outOfMemory]
      properties:
        id:
          type: string
          description: The Nomad allocation ID.
        service:
          type: string
        node:
          type: string
          description: The name of the node the copy runs on.
        version:
          type: integer
          minimum: 0
          description: The job version the copy runs.
        status:
          type: string
          enum: [starting, healthy, unhealthy, stopped, failed]
        restarts:
          type: integer
          minimum: 0
        startedAt:
          type: string
          format: date-time
          description: When the copy's first task started. Absent until one has.
        description:
          type: string
          description: Nomad's own description of the copy's state, e.g. `Tasks are running`.
        lastRestartAt:
          type: string
          format: date-time
          description: When any of the copy's tasks last restarted. Absent if none has.
        outOfMemory:
          type: boolean
          description: |
            The service's last stop was the kernel killing it for passing its memory ceiling
            (`memoryMaxMB`).
        usage:
          $ref: "#/components/schemas/CopyUsage"

    CopyUsage:
      type: object
      additionalProperties: false
      description: |
        What one running copy's service task uses now, read from Nomad when asked for. The
        sidecar that lets services find each other is not counted. Only with `usage=true`, and
        only for copies that have started and not ended. When Nomad can't give this copy's
        numbers, only `error` is present.
      properties:
        cpuMHz:
          type: integer
          minimum: 0
          description: CPU used now, in MHz.
        memoryMB:
          type: integer
          minimum: 0
          description: Memory used now, in MB.
        cpuReservedMHz:
          type: integer
          minimum: 0
          description: The service's CPU reservation, in MHz, with the default applied.
        memoryReservedMB:
          type: integer
          minimum: 0
          description: The service's memory reservation, in MB, with the default applied.
        memoryCeilingMB:
          type: integer
          minimum: 0
          description: The most memory the service may use before the kernel stops it, in MB.
        nearCeiling:
          type: boolean
          description: '`memoryMB` is 90 % or more of `memoryCeilingMB`.'
        error:
          type: string
          description: A sentence saying Nomad couldn't give this copy's numbers; the numbers are absent.

    CopyList:
      type: object
      additionalProperties: false
      required: [copies]
      properties:
        copies:
          type: array
          items:
            $ref: "#/components/schemas/Copy"

    Attention:
      type: object
      additionalProperties: false
      required: [items, copiesUnknown]
      properties:
        items:
          type: array
          description: Newest first.
          items:
            $ref: "#/components/schemas/AttentionItem"
        copiesUnknown:
          type: boolean
          description: |
            True when Nomad couldn't be read: the copy kinds (`out_of_memory`, `restarting`,
            `unhealthy`) may be missing.

    AttentionItem:
      type: object
      additionalProperties: false
      required: [kind, at]
      properties:
        kind:
          type: string
          enum: [deploy_failed, out_of_memory, restarting, unhealthy, backup_failed, restore_failed, no_backup_destination,
            schedule_failed, schedule_skipping, domain_dns_elsewhere, domain_cert_expiring]
          description: |
            What needs a person. `schedule_failed`: a schedule's latest run that ended, not
            counting skipped slots and runs stopped on purpose, failed (an exit code other than 0,
            stopped at its limit, or it couldn't start); a later run that succeeds clears it.
            `schedule_skipping`, a warning: the schedule's last 3 slots were skipped because
            the run before was still going. `domain_dns_elsewhere`: a domain's DNS answers with
            an address that isn't this host's. `domain_cert_expiring`: a domain's certificate
            ends within the warning window (`getCertificateSettings`) and hasn't been renewed,
            which is how a failing renewal shows. Both come from Caravana's last check of the
            domain (`listDomains`) and go when a check finds it fixed, or the domain is removed.
            Clients should accept kinds they don't know.
        appId:
          type: string
          description: Absent for `no_backup_destination`, which is about the installation.
        project:
          type: string
          description: The project of `appId`'s app. Absent when `appId` is.
        environment:
          type: string
          description: The environment of `appId`'s app. Absent when `appId` is.
        appName:
          type: string
          description: The name of `appId`'s app in its environment. Absent when `appId` is.
        service:
          type: string
          description: The service, for the copy, backup, schedule and domain kinds.
        schedule:
          type: string
          description: The schedule's name, for the schedule kinds.
        domain:
          type: string
          description: The host, for the domain kinds (`getDomain`).
        addressSeen:
          type: string
          description: |
            For `domain_dns_elsewhere`: the first address the domain's DNS gave that isn't this
            host's.
        expiresAt:
          type: string
          format: date-time
          description: For `domain_cert_expiring`, when the certificate ends.
        scheduleId:
          type: string
          description: The schedule's ID (`getSchedule`), for the schedule kinds.
        copies:
          type: array
          items:
            type: string
          description: The IDs of the copies it is about (from `listCopies`), for the copy kinds.
        deploymentId:
          type: string
          description: The deployment, for `deploy_failed`.
        deploymentStatus:
          type: string
          enum: [failed, reverted]
          description: How that deployment ended, for `deploy_failed`.
        jobVersion:
          type: integer
          minimum: 0
          description: The deployment's job version, for `deploy_failed`, when it was registered.
        at:
          type: string
          format: date-time
          description: |
            When it happened: the deployment's end, the copy's last restart (an unhealthy copy:
            its start), the backup's or restore's end, the newest change to an app that asks
            for backups, the failed run's end, the newest skipped slot, or the domain check
            that found it.
        detail:
          type: string
          description: |
            The raw fact, e.g. Nomad's description or the error of the deploy or backup. For the
            schedule kinds, a sentence in Caravana's words ("Exited with code 3.", "Stopped at
            the 5 min limit.", "Couldn't start: Nomad refused the job."), never the run's output.
            For the domain kinds, the sentence ("shop.example.com points at 185.199.108.153,
            which isn't this host.", "The certificate for bi.example.com expires in 6 days and
            hasn't been renewed.").

    LogLine:
      type: object
      additionalProperties: false
      required: [copy, service, stream, text]
      properties:
        copy:
          type: string
          description: The ID of the copy that wrote it.
        service:
          type: string
        stream:
          type: string
          enum: [stdout, stderr]
        text:
          type: string
          description: One line without its newline. Plain text; invalid UTF-8 is replaced and a line over 64 KiB is cut.
        time:
          type: string
          format: date-time
          description: When Caravana received the line. Only on followed lines; the recent lines have none.

    LogLines:
      type: object
      additionalProperties: false
      required: [lines]
      properties:
        lines:
          type: array
          items:
            $ref: "#/components/schemas/LogLine"

    Deployment:
      type: object
      additionalProperties: false
      required: [id, appId, project, environment, appName, trigger, status, digests, warnings, definitionRecorded, composeKept, createdAt, updatedAt]
      properties:
        id:
          type: string
        appId:
          type: string
        project: {$ref: "#/components/schemas/PlaceProject"}
        environment: {$ref: "#/components/schemas/PlaceEnvironment"}
        appName: {$ref: "#/components/schemas/PlaceAppName"}
        trigger:
          type: string
          enum: [manual, webhook, console]
        status:
          type: string
          enum: [pending, running, healthy, failed, reverted, superseded]
          description: |
            `healthy`, `failed`, `reverted` (failed, and Nomad rolled back to the previous
            version) and `superseded` (a newer deploy replaced it) are final.
        jobVersion:
          type: integer
          minimum: 0
          description: The Nomad job version. Absent until Nomad accepts the job.
        digests:
          type: object
          description: Each service's image as deployed, pinned by digest.
          additionalProperties:
            type: string
            pattern: "@sha256:[a-f0-9]{64}$"
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        error:
          type: string
          description: Why it failed, reverted or was superseded. Absent otherwise.
        source:
          type: string
          description: |
            The deployment of this app that this one redeployed (`redeployDeployment`). Absent
            otherwise, and absent on a promotion (see `promotedFrom`).
        promotedFrom:
          $ref: "#/components/schemas/PromotedFrom"
        definitionRecorded:
          type: boolean
          description: |
            Whether Caravana saved what this deployment deployed. Only then can it be exported,
            and redeployed once healthy. False for deployments from before version 0.9.0.
        composeKept:
          type: boolean
          description: |
            The deployment was made from a Compose file, and `getDeploymentCompose` answers
            200. False for deployments from an image or a definition, and from before version
            0.12.0.
        origin:
          $ref: "#/components/schemas/Origin"
        tokenName:
          type: string
          description: |
            The name of the API token that made the deploy, as it was when the deploy was
            made (`deployApp`, `deployCompose`, `promoteApp`, `redeployDeployment`). Absent for
            a deploy made from the console, by the webhook, and for deployments recorded before
            version 0.23.0.
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        progress:
          $ref: "#/components/schemas/Progress"

    Origin:
      type: object
      additionalProperties: false
      description: |
        Where a deploy came from, as the `Caravana-Origin-*` headers of `deployApp`,
        `deployCompose`, `promoteApp` or `callWebhook` said. Each part is optional; the whole
        is absent when none was sent. The history shows it as "from CI".
      properties:
        commit:
          type: string
          description: The commit, in lowercase.
          examples: [abc1234def5678]
        ref:
          type: string
          examples: [refs/heads/main]
        actor:
          type: string
          examples: [ana]
        run:
          type: string
          description: The CI run's `https://` address.
        repository:
          type: string
          examples: [acme/shop]

    Progress:
      type: object
      additionalProperties: false
      description: |
        How far a rollout has got, summed over the app's services. Only on a deployment that is
        `running`, and only from `getDeployment` and, for the newest running one, from
        `listDeployments`. Absent when Nomad has no rollout for the deployment yet or can't be
        read.
      required: [wanted, placed, healthy, unhealthy, canariesWanted, promoted]
      properties:
        wanted: {type: integer, minimum: 0, description: New copies the rollout wants in all.}
        placed: {type: integer, minimum: 0, description: New copies Nomad has placed.}
        healthy: {type: integer, minimum: 0, description: New copies that passed their health checks.}
        unhealthy: {type: integer, minimum: 0, description: New copies that failed their health checks.}
        canariesWanted:
          type: integer
          minimum: 0
          description: Copies that wait for promotion before the old ones are replaced (blue/green).
        promoted:
          type: boolean
          description: Every service that waits for promotion has been promoted.
        description:
          type: string
          description: Nomad's own status description of the rollout.

    PromotedFrom:
      type: object
      additionalProperties: false
      description: |
        Present only on a deployment made by `promoteApp`: where its images and shape came
        from.
      required: [app, environment, deployment]
      properties:
        app:
          type: string
          description: The source app's ID.
          examples: [shop--staging--web]
        environment:
          type: string
          description: The source app's environment.
          examples: [staging]
        deployment:
          type: string
          description: The source's deployment, whose digests this one runs.

    PromotionRequest:
      type: object
      additionalProperties: false
      required: [to]
      properties:
        to:
          $ref: "#/components/schemas/Name"
          description: |
            The environment to promote or copy into: another environment of the app's own
            project.

    PromotionServiceChange:
      type: object
      additionalProperties: false
      description: What a promotion does to one service of the target.
      required: [name, imageTo, digestTo, changed]
      properties:
        name: {type: string}
        imageFrom:
          type: string
          description: |
            The image the target runs now, as written (`repo:tag`). Absent for a service the
            promotion adds.
        imageTo:
          type: string
          description: The source's image, as written.
        digestFrom:
          type: string
          description: |
            The digest the target's newest healthy deployment pinned. Absent for an added
            service and for a target that was never deployed.
        digestTo:
          type: string
          description: The digest the source's deployment pinned, which the target will run.
        changed:
          type: array
          description: |
            The parts of the service's shape the promotion replaces and that differ from the
            target's now.
          items:
            type: string
            enum: [entrypoint, command, args, ports, health, volumes]

    PromotionPreview:
      type: object
      additionalProperties: false
      required: [from, to, fromEnvironment, toEnvironment, fromDeployment, services, added, warnings, targetRevision]
      properties:
        from: {type: string, description: "The source app's ID."}
        to: {type: string, description: "The target app's ID."}
        fromEnvironment: {type: string}
        toEnvironment: {type: string}
        fromDeployment:
          type: string
          description: The source's newest deployment, which the target would run.
        services:
          type: array
          description: Every service the target will have, in order.
          items:
            $ref: "#/components/schemas/PromotionServiceChange"
        added:
          type: array
          description: The services the target doesn't have yet and gets whole, without domains.
          items: {type: string}
        warnings:
          type: array
          items:
            $ref: "#/components/schemas/Warning"
        targetRevision:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: |
            The target's revision now. Send it as `If-Match` to `promoteApp` to promote only
            if the target is still as the preview saw it.

    MissingSecret:
      type: object
      additionalProperties: false
      required: [service, name]
      properties:
        service: {type: string}
        name: {type: string}

    CopyResult:
      type: object
      additionalProperties: false
      description: The new app, as `getApp` shows it, and the secrets it needs values for.
      required: [app, createdAt, updatedAt, revision, composeKept, defined, project, environment, appName, missingSecrets]
      properties:
        app:
          $ref: "#/components/schemas/App"
        project: {$ref: "#/components/schemas/PlaceProject"}
        environment: {$ref: "#/components/schemas/PlaceEnvironment"}
        appName: {$ref: "#/components/schemas/PlaceAppName"}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        revision:
          $ref: "#/components/schemas/AppRecord/properties/revision"
        composeKept:
          type: boolean
        defined:
          $ref: "#/components/schemas/AppDefined"
        missingSecrets:
          type: array
          description: |
            Every secret of the copy, by service and name: none has a value yet. Empty when
            the app has no secrets.
          items:
            $ref: "#/components/schemas/MissingSecret"

    DeploymentList:
      type: object
      additionalProperties: false
      required: [deployments]
      properties:
        deployments:
          type: array
          items:
            $ref: "#/components/schemas/Deployment"

    WebhookToken:
      type: object
      additionalProperties: false
      required: [token, path, createdAt]
      properties:
        token:
          type: string
          pattern: "^cvwh_[A-Za-z0-9_-]{43}$"
          description: "Shown only here. Store it in the sender (registry, CI secret)."
        path:
          type: string
          description: The webhook path with the token, e.g. `/v1/webhooks/whoami?token=cvwh_…`.
        createdAt: {type: string, format: date-time}

    WebhookStatus:
      type: object
      additionalProperties: false
      required: [enabled]
      properties:
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
          description: When the current token was created. Absent when `enabled` is false.

    WebhookResult:
      type: object
      additionalProperties: false
      required: [changed, deployment]
      properties:
        changed:
          type: boolean
          description: "True when the call started a deployment; false when nothing changed."
        deployment:
          $ref: "#/components/schemas/Deployment"

    Warning:
      type: object
      additionalProperties: false
      required: [field, message]
      properties:
        field:
          type: string
          description: The input field the warning is about; empty when it isn't about one.
        message:
          type: string

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: |
                Stable, machine-readable error code. Clients must accept codes they don't
                know. Current codes: `bad_request`, `invalid_field`, `unknown_field`,
                `unsupported_media_type`, `body_too_large`, `not_found`,
                `method_not_allowed`, `internal`, `unavailable`, `image_not_found`,
                `job_conflict`, `registry_unavailable`, `nomad_unavailable`,
                `nomad_rejected`, `unauthorized`, `cross_origin`, `token_name_taken`, `app_exists`,
                `secret_store_unavailable`, `backup_running`, `no_backup_destination`,
                `no_running_copy`, `deployment_not_healthy`, `definition_not_recorded`, `no_live_deployment`,
                `app_changed`, `app_not_defined`, `compose_not_kept`, `registry_auth_failed`, `not_a_webhook`,
                `project_not_found`, `environment_not_found`, `project_exists`,
                `environment_exists`, `not_empty`, `protected`, `app_not_in_environment`,
                `promotion_removes_service`, `app_stopped`, `app_not_stopped`, `app_busy`,
                `copy_not_running`, `token_scope`, `app_not_found`, `schedule_not_found`, `run_not_found`,
                `output_not_kept`, `builtin_schedule`, `schedule_exists`, `run_going`, `run_not_running`.
              examples: [invalid_field]
            message:
              type: string
              description: Human-readable explanation. Not meant to be parsed.
            field:
              type: string
              description: |
                The one request field at fault, as a path like
                `services[0].domains[1].port`. Absent when no single field is at fault.
              examples: ["services[0].domains[1].port"]


    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
          description: A wrong one gets 400 `invalid_field` with `field` `currentPassword`.
        newPassword:
          type: string
          writeOnly: true
          minLength: 12
          description: At least 12 characters. A shorter one gets 400 `invalid_field`.

    CreateTokenRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]*$"
          description: A label for the token, such as where it is used.
          examples: [ci-github]
        expiresAt:
          type: string
          format: date-time
          description: When the token stops working. Must be in the future. Absent means never.
        scope:
          $ref: "#/components/schemas/TokenScope"

    TokenInfo:
      type: object
      # No `additionalProperties: false` here: CreatedToken extends this schema with
      # `token`, and a closed base would reject it.
      required: [id, name, createdAt, state]
      properties:
        id:
          type: string
          description: The token's ID, used to revoke it. Not the token itself.
          examples: ["p4nzr2t6v3x7z5bqd7f4h6j3kq"]
        name:
          type: string
          examples: [ci-github]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          description: Absent until first used. Updated at most once a minute.
        expiresAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
        state:
          type: string
          enum: [active, expired, revoked]
        scope:
          $ref: "#/components/schemas/TokenScope"

    TokenScope:
      type: object
      additionalProperties: false
      description: |
        What a deploy token is limited to: the app named `app` in any environment of `project`.
        Absent on a full token.
      required: [project, app]
      properties:
        project:
          $ref: "#/components/schemas/Name"
        app:
          $ref: "#/components/schemas/Name"

    CreatedToken:
      allOf:
        - $ref: "#/components/schemas/TokenInfo"
        - type: object
          required: [token]
          properties:
            token:
              type: string
              description: The token, shown only in this response.
              pattern: "^cvat_[A-Za-z0-9_-]{43}$"

    TokenList:
      type: object
      additionalProperties: false
      required: [tokens]
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenInfo"

  responses:
    Jobspec:
      description: |
        The jobspec, as a download named `<app>.nomad.hcl`. Errors are JSON, as everywhere.
      headers:
        Content-Disposition:
          description: '`attachment; filename="<app>.nomad.hcl"`'
          schema: {type: string}
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: The server can't reach its store.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: |
        The request is invalid (`bad_request`, `invalid_field`, `unknown_field`); `field`
        names the field at fault. Nothing was saved or recorded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No app with this ID is stored.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlaceNotFound:
      description: |
        `project_not_found` (`field` `project`, or `id` when an app ID named it) or
        `environment_not_found` (`field` `environment`, or `id`): no such project, or the
        project has no such environment. For `getEnvironmentApp`, also `not_found`: no app has
        that name there.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlaceExists:
      description: |
        `project_exists` or `environment_exists`, with `field` `name`: the name is taken
        (project names are unique in the installation, environment names in their project).
        Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlaceInUse:
      description: |
        `not_empty`: apps are still there, and the message names them; delete or move them
        first. `protected`: project `default` and its `production` environment can't be deleted,
        since apps that existed before projects live there and their IDs depend on it.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PlaceInvalid:
      description: |
        `invalid_field`: `field` is `name` (not a lowercase label, or it holds `--`) or
        `displayName` (empty, not printable, or over 100 characters). Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PromotionNotFound:
      description: |
        `not_found`: no such app. `environment_not_found` (`field` `to`): the project has no
        such environment. `app_not_in_environment` (`field` `to`): that environment has no app
        of this name; the message says to copy it first (`copyApp`). `no_live_deployment`
        applies too, as 409 below.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PromotionRefused:
      description: |
        `deployment_not_healthy`: the source's newest deployment is not healthy.
        `definition_not_recorded`: it is from before Caravana saved what each deployment
        deployed. `no_live_deployment`: the source was never deployed.
        `promotion_removes_service` (`field` `services.<name>`): the target has a service the
        source lacks, and promoting would delete it. `job_conflict`: as for `deployApp`.
        `app_stopped`: the target is stopped (`stopApp`); start it first.
        Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    PromotionInvalid:
      description: |
        `invalid_field` with `field` `to`: not a name, or the source's own environment.
        `image_not_found` and `registry_auth_failed`: an image the promotion would run is no
        longer in its registry, or its registry refused the stored credentials (`field` is the
        service's `image`); nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RegistryNotFound:
      description: Caravana has no credentials for this registry host (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RegistryInvalid:
      description: |
        `invalid_field`: `field` is `host` (not a registry host), `username` (empty) or
        `password` (missing when creating, or present but empty). Nothing was saved.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotificationNotFound:
      description: There is no notification channel with this ID (`not_found`).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotificationInvalid:
      description: |
        `invalid_field`: `field` is `kind` (unknown), `name` (empty or over 80 characters), `url`
        (empty, not an absolute http or https URL, or holding a user name and password in a
        webhook or ntfy URL), `token` (on a channel that isn't ntfy) or `events` (none, or an
        unknown one). Nothing was saved. The message never repeats the URL.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BodyTooLarge:
      description: The request body is larger than 1 MiB.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnsupportedMediaType:
      description: The body isn't `application/json` in UTF-8.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BackupConflict:
      description: |
        `backup_running`: a backup or restore of this service is running; try again when it
        ends. `no_backup_destination`: no backup destination is set. `no_running_copy`: a
        backup or restore of a service with a `volume` backup, and the service has no running
        copy to stop (it was never deployed, is still starting, or has stopped).
        `app_stopped`: the app is stopped (`stopApp`); start it first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AppChanged:
      description: |
        `app_changed`: `If-Match` was sent and the stored app's revision differs, so someone
        saved a change since the client read it. Nothing was saved or deployed. The message
        names the app's current revision; read the app again (`getApp`) and decide.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    AppCreated:
      description: |
        Saved without deploying (`deploy=false`): the stored app, its `revision` also as `ETag`
        and the app's URL as `Location`. No deployment exists yet.
      headers:
        Location:
          $ref: "#/components/headers/AppLocation"
        ETag:
          $ref: "#/components/headers/AppETag"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AppRecord"
    ActionConflict:
      description: |
        `app_stopped`: the app is stopped (`stop`, `restart`). `app_not_stopped`: it isn't
        (`start`). `app_busy`: a deploy, a volume backup or another action of the app is
        running; try again when it ends. `app_not_defined` or `no_live_deployment`: the app was
        never deployed. `no_running_copy`: no copy of the live version runs (`restart`).
        Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    DeployConflict:
      description: |
        `job_conflict`: Nomad already runs a job with this app's ID that Caravana didn't
        create, or the job changed while deploying. Nothing was registered; the deployment
        record (see `Location`) is `failed`. Or `app_not_defined`: the app has no services yet,
        so there is nothing stored to deploy; nothing was recorded and there is no `Location`.
        Or `app_stopped`: the app is stopped (`stopApp`); start it first. Nothing was saved or
        recorded and there is no `Location`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    JobConflict:
      description: |
        `job_conflict`: Nomad already runs a job with this app's ID that Caravana didn't
        create, or the job changed while deploying. Nothing was registered; the deployment
        record (see `Location`) is `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ImageNotFound:
      description: |
        `image_not_found`: the registry has no such image or tag, or it's private and no
        credentials are stored for it (the message says to add them in Settings › Registries,
        or with `putRegistry`). `registry_auth_failed`: credentials are stored for the
        image's registry and it refused them (the message names the registry and the image;
        fix them with `putRegistry` and check them with `testRegistry`). `field` is the
        service's `image`. Nothing was registered; the deployment record (see `Location`) is
        `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadGateway:
      description: |
        The registry or Nomad couldn't be used: `registry_unavailable` (unreachable, erroring
        or rate-limiting; `field` is the service's `image`), `nomad_unavailable` (unreachable
        or the token was refused) or `nomad_rejected` (the message is what Nomad said). The
        deployment record (see `Location`) is `failed`.
      headers:
        Location:
          $ref: "#/components/headers/DeploymentLocation"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NomadUnavailable:
      description: |
        Nomad couldn't be used: `nomad_unavailable` (unreachable, or the token was refused) or
        `nomad_rejected` (the message is what Nomad said). Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: |
        `unauthorized`. On API routes: no valid API token or session (missing, malformed,
        wrong, expired or revoked, or no admin exists yet). On the webhook: the webhook token is
        missing or wrong, or the app has none, or there is no such app. Every reason gets the
        same answer.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            const: Bearer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    CrossOrigin:
      description: |
        `cross_origin`: a state-changing request authenticated by the session cookie came from
        another site. Nothing was changed. Requests with an API token never get this. A deploy
        token (an API token with a `scope`) gets `token_scope` here instead for anything outside
        its app, as `components/responses/TokenScope` says.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenScope:
      description: |
        `token_scope`: the request was made with a deploy token (an API token with a `scope`)
        and is not one that token may make, or is about another app than its own. `message`
        says what the token can do. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TokenNameTaken:
      description: "`token_name_taken`: an active token already has this name. `field` is `name`."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleNotFound:
      description: |
        `schedule_not_found`: no such schedule (for a built-in one, the service has no backup
        policy). `run_not_found`: the schedule has no such run. `output_not_kept`
        (`getScheduleRunOutput`): the run never ran, its output couldn't be read, or it is a
        backup's run.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleAppNotFound:
      description: "`app_not_found` (`field` `app`): no app has this ID."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleConflict:
      description: |
        `builtin_schedule`: the schedule is a service's backup; change it in the app's backup
        policy. `schedule_exists` (`field` `name`): the app already has a schedule of this
        name. `run_going` (`runSchedule`): a run is going and the schedule skips overlapping
        runs, or 3 are going. `run_not_running` (`stopScheduleRun`): the run has ended.
        `app_stopped` (`runSchedule`): the app is stopped; start it first.
        `no_live_deployment` (`runSchedule`): the app has no healthy version, or a deploy of it
        is going. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ScheduleInvalid:
      description: |
        `invalid_field`, `field` naming it: `app` (not defined yet, or another app than the
        schedule's), `name`, `command`, `cron` (not five fields, fires more than once a minute,
        never fires), `service` (unknown, or it mounts a volume), `stopAfterSeconds`,
        `memoryMB`, `limit` or `stream`. Nothing was changed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Internal:
      description: An unexpected server error. Details are in the server log.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

tags:
  - name: system
    description: Server health.
  - name: apps
    description: Stored app definitions.
  - name: projects
    description: Projects, their environments, and the apps in each.
  - name: deployments
    description: Deploying apps and following their rollouts.
  - name: webhooks
    description: Webhook tokens, and the webhook that redeploys an app.
  - name: registries
    description: Credentials for private container registries.
  - name: notifications
    description: Channels that tell the owner what needs them and how deploys end, and their deliveries.
  - name: schedules
    description: Commands run on a timer in a fresh copy of an app, and their runs.
  - name: tokens
    description: API tokens for clients (CI, scripts, the Aspire integration).
  - name: account
    description: The one admin account.
