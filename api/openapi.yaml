                  $ref: "#/components/schemas/Registry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/Internal"

  /v1/registries/{host}:
    parameters:
      - $ref: "#/components/parameters/RegistryHost"
    put:
      operationId: putRegistry
      summary: Store the credentials for a private registry.
      description: |
        Creates the entry or replaces the one with this host. `password` is required when
        creating and optional when updating: leave it out to keep the secret stored before.
        It is never returned. Nothing is deployed or restarted: the next deploy of an image
        from this registry uses the credentials, and apps already running pick them up the next
        time they start. A save that changes the credentials forgets the last test.
      tags: [registries]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegistryRequest"
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Registry"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "413":
          $ref: "#/components/responses/BodyTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "422":
          $ref: "#/components/responses/RegistryInvalid"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"
    delete:
      operationId: deleteRegistry
      summary: Forget the credentials for a registry.
      description: |
        Apps already running keep running. The next deploy of a private image from this
        registry fails until credentials are added again.
      tags: [registries]
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/CrossOrigin"
        "404":
          $ref: "#/components/responses/RegistryNotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "502":
          $ref: "#/components/responses/BadGateway"

  /v1/registries/{host}/test:
    parameters:
      - $ref: "#/components/parameters/RegistryHost"
    post:
      operationId: testRegistry
      summary: Ask the registry to accept the stored credentials.
      description: |
        Makes one request to the registry and records the outcome with its time. A registry
        that refuses the credentials or can't be reached is an answer, not an error: the
        response is 200 and `lastTest.ok` is false, with the reason in `lastTest.message`.
      tags: [registries]
      responses:
        "200":
          description: The registry, with `lastTest` updated.
          content:
            application/json:
