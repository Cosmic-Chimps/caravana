# Builds the Codemagic Patch server image from an upstream release tag and pushes it to this
# organization's GHCR as a private image. Upstream publishes no image: its installer builds
# server/Dockerfile on the host, and Caravana deploys images, it doesn't build them.
#
# Copy this file to .github/workflows/build-image.yml in a repository of its own (for example
# Cosmic-Chimps/codemagic-patch-image), then run it from the Actions tab with the version to build.
# The image is ghcr.io/<owner>/codemagic-patch-server:<version>. Keep the package private: the server
# is under the Codemagic Server License (see RUNBOOK.md).
name: build-image

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Upstream server version, without the v (tag codemagic-patch-server-v<version>)"
        required: true
        default: "0.9.0"
      platforms:
        description: "Image platforms (the host's: uname -m gives x86_64 = linux/amd64, aarch64 = linux/arm64)"
        required: true
        default: "linux/amd64"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version must be X.Y.Z, got $VERSION" >&2; exit 1; }

      - name: Check out the upstream release
        uses: actions/checkout@v4
        with:
          repository: codemagic-ci-cd/codemagic-patch
          ref: codemagic-patch-server-v${{ inputs.version }}
          persist-credentials: false

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/codemagic-patch-server" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ inputs.version }}
          # No image.source label: GHCR links a package to the repository it names, which isn't ours.
          labels: |
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.description=Codemagic Patch server ${{ inputs.version }}, built from codemagic-ci-cd/codemagic-patch
