# Hollo (https://docs.hollo.social), a single-user fediverse server, on Caravana. It is the
# upstream Docker example without MinIO: media lives on a volume (DRIVE_DISK=fs), so it is two
# services, Hollo and Postgres, each with a volume.
#
# Secrets are not in this file: SECRET_KEY and DATABASE_URL (hollo) and POSTGRES_PASSWORD
# (postgres) come from overlay.json, which deploy.sh sends with it. See RUNBOOK.md.
name: hollo
services:
  hollo:
    image: ghcr.io/fedify-dev/hollo:0.6.16
    expose: ["3000"]
    environment:
      BEHIND_PROXY: "true" # Traefik terminates HTTPS in front of it
      LOG_LEVEL: info
      DRIVE_DISK: fs
      FS_STORAGE_PATH: /var/lib/hollo
      # deploy.sh puts Hollo's domain from overlay.json in place of social.example.com.
      STORAGE_URL_BASE: https://social.example.com/assets
    volumes:
      - media:/var/lib/hollo
    depends_on: [postgres]

  postgres:
    image: postgres:17
    expose: ["5432"]
    environment:
      POSTGRES_USER: hollo
      POSTGRES_DB: hollo
    volumes:
      - db:/var/lib/postgresql/data

volumes:
  media: {}
  db: {}
