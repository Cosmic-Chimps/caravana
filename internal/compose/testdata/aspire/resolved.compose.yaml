services:
  cache:
    image: "docker.io/library/redis:8.6"
    command:
      - "-c"
      - "redis-server --requirepass $$REDIS_PASSWORD"
    entrypoint:
      - "/bin/sh"
    expose:
      - "6379"
    networks:
      - "aspire"
  seq:
    image: "docker.io/datalust/seq:2025.2"
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "True"
    expose:
      - "80"
    volumes:
      - type: "volume"
        target: "/data"
        source: "seq-data"
        read_only: false
    networks:
      - "aspire"
  apiservice:
    image: "ghcr.io/example/apiservice@sha256:1111111111111111111111111111111111111111111111111111111111111111"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      ConnectionStrings__seq: "http://seq:80"
      SEQ_HOST: "seq"
      SEQ_PORT: "80"
      SEQ_URI: "http://seq:80"
      OTEL_SERVICE_NAME: "apiservice"
    expose:
      - "8080"
    networks:
      - "aspire"
  webfrontend:
    image: "ghcr.io/example/webfrontend@sha256:2222222222222222222222222222222222222222222222222222222222222222"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "8080"
      CACHE_HOST: "cache"
      CACHE_PORT: "6379"
      APISERVICE_HTTP: "http://apiservice:8080"
      services__apiservice__http__0: "http://apiservice:8080"
      APISERVICE_HTTPS: "https://apiservice:8080"
      OTEL_SERVICE_NAME: "webfrontend"
    ports:
      - "8080"
    depends_on:
      cache:
        condition: "service_started"
      apiservice:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
volumes:
  seq-data:
    driver: "local"
