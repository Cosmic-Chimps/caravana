{{define "base"}}<!doctype html>
<html lang="en" data-theme="caravana"{{with .Theme}} data-cv-theme="{{.}}"{{end}}>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="{{if .Theme}}{{.Theme}}{{else}}dark light{{end}}">
<meta name="htmx-config" content='{"allowEval":false,"allowScriptTags":false,"includeIndicatorStyles":false,"historyCacheSize":0}'>
<title>{{.Title}} · caravana</title>
<link rel="stylesheet" href="{{asset "app.css"}}">
<link rel="icon" href="{{asset "brand/favicon.ico"}}" sizes="16x16 32x32 48x48">
<link rel="icon" href="{{asset "brand/favicon.svg"}}" type="image/svg+xml">
<link rel="apple-touch-icon" href="{{asset "brand/apple-touch-icon.png"}}">
<script src="{{asset "js/htmx.min.js"}}" defer></script>
<script src="{{asset "js/sse.min.js"}}" defer></script>
<script src="{{asset "js/console.js"}}" defer></script>
<script src="{{asset "js/localtime.js"}}" defer></script>
{{block "head" .}}{{end}}
{{if .Refresh}}<noscript><meta http-equiv="refresh" content="{{.RefreshContent}}"></noscript>{{end}}
</head>
<body class="min-h-screen"{{with .LiveURL}} hx-ext="sse" sse-connect="{{.}}" sse-close="ended" data-live{{end}}>
{{if .Shell}}{{template "shell" .}}{{else}}{{template "content" .}}{{end}}
</body>
</html>
{{end}}
