name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool staticcheck ./...
      # Under the race detector the larger packages (api, service, ui) each take about 23 minutes on a
      # GitHub runner (1400 s on 2026-11-17), and a slower runner went past 30: hence 50.
      - run: go test -race -timeout 50m ./...

      # Lab, VM and install scripts can't run in CI; shellcheck (preinstalled on ubuntu-latest)
      # checks them. deploy/dev/install-test.sh runs the installer on a VM.
      - name: shellcheck
        run: shellcheck deploy/dev/*.sh deploy/vm/*.sh deploy/install/*.sh deploy/examples/*/*.sh tools/*.sh

      # Release notes live one file per change in changelog.d/, so a merge never touches a shared
      # section. This fails a push with a bad note file or a "## Unreleased" section (a branch
      # started before that rule), and the next step tests the commands themselves.
      - name: release notes in changelog.d are well formed
        run: tools/release.sh check

      - name: changelog script tests
        run: bash tools/changelog-test.sh

      # The release a v* tag would publish still builds (tools/release.sh, release.yml).
      - name: release builds
        run: |
          tools/release.sh build 0.0.0-ci "$RUNNER_TEMP/release"
          (cd "$RUNNER_TEMP/release" && sha256sum -c SHA256SUMS)

      # The committed stylesheet must match its sources (the pinned Tailwind CLI, checksum-verified).
      - name: stylesheet is up to date
        run: tools/ui-css.sh check

      # The vendored htmx files must match the checksums pinned in tools/ui-vendor.versions.
      - name: vendored scripts match their pins
        run: tools/ui-vendor.sh check

      - name: cross-compile (no CGO)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
