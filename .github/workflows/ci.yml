name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go tool staticcheck ./...
      - run: go test -race ./...

      # Lab and VM scripts can't run in CI; shellcheck (preinstalled on ubuntu-latest) checks them.
      - name: shellcheck
        run: shellcheck deploy/dev/*.sh deploy/vm/*.sh tools/*.sh

      # The committed stylesheet must match its sources (the pinned Tailwind CLI, checksum-verified).
      - name: stylesheet is up to date
        run: tools/ui-css.sh check

      # The vendored htmx files must match the checksums pinned in tools/ui-vendor.versions.
      - name: vendored scripts match their pins
        run: tools/ui-vendor.sh check

      - name: cross-compile (no CGO)
        env:
          CGO_ENABLED: "0"
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=linux GOARCH=arm64 go build ./...
