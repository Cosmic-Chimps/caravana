name: release

# Publishes a release: the installer, one tarball per architecture and their checksums, built by
# tools/release.sh. deploy/install/README.md says how users install it.
#
# Start it from GitHub (Actions › release › Run workflow) or with
#
#   gh workflow run release.yml -f version=0.6.0
#
# It renames CHANGELOG.md's "## Unreleased" to "## 0.6.0 - <today>" (tools/release.sh prepare),
# commits that to main, tags the commit v0.6.0, then builds and publishes from that tag. Nothing
# is done by hand, so the tag can't point at a changelog that wasn't prepared (what broke the
# first runs of v0.4.0 and v0.5.0). A version whose section is already there (prepared and merged
# by hand) skips the rename.
#
# Pushing a v* tag by hand (git tag v0.6.0 && git push origin v0.6.0) works too. When the tagged
# commit has no "## 0.6.0" section, the run prepares it in its own checkout, so the notes are
# the "Unreleased" entries, and after publishing commits that rename to main, as long as main is
# still at the tagged commit. The tag itself never moves. If main has moved on, the release is
# still published and the run ends with a warning saying how to fix the changelog by hand.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, X.Y.Z (no v)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write # commit the changelog, push the tag, create the release

# Two releases never run at once: both would commit to main.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # A dispatched run starts from main's tip; a tag push from the tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || github.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # Which version: the input of a dispatched run, or the pushed tag without its "v".
      - name: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            version="${INPUT_VERSION#v}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "TAG=v$version" >>"$GITHUB_ENV"

      # A dispatched run refuses a version that is already tagged: a release is never replaced.
      - name: refuse an existing tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG already exists. Delete it first (git push origin :refs/tags/$TAG) if no release was published from it."
            exit 1
          fi

      # The changelog, prepared here unless it already has the version's section: for a
      # dispatched run and for a pushed tag alike. prepare fails, before anything is built, when
      # "## Unreleased" is empty: then there is nothing to say about this release.
      - name: prepare the changelog
        run: |
          if ! tools/release.sh notes "$VERSION" >/dev/null 2>&1; then
            tools/release.sh prepare "$VERSION"
          fi

      # The release's notes are its CHANGELOG.md section.
      - name: notes
        run: tools/release.sh notes "$VERSION" >"$RUNNER_TEMP/notes.md"

      # The same checks as CI: a release is never built from a commit that fails them.
      - run: go vet ./...
      # The race detector makes the larger packages (api, ui, service) take 7-10 minutes on a
      # runner, past go test's default 10-minute limit for one package.
      - run: go test -race -timeout 30m ./...

      # Only now, with the checks green, does a dispatched run commit and tag. Main and the tag
      # go up in one atomic push: both or neither.
      - name: commit and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- CHANGELOG.md; then
            git commit -m "chore(release): $VERSION" -- CHANGELOG.md
          fi
          git tag -a "$TAG" -m "$TAG"
          git push --atomic origin HEAD:main "refs/tags/$TAG"

      - name: build
        run: tools/release.sh build "$VERSION" dist

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # --generate-notes adds GitHub's list of commits and the compare link after our notes.
        run: >-
          gh release create "$TAG" dist/* --title "Caravana $VERSION"
          --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --verify-tag

      # A pushed tag whose changelog was prepared above: main gets the rename, so the next
      # release starts from an empty "Unreleased". Only when main is still the tagged commit;
      # otherwise its "Unreleased" may hold newer entries, which a rename would wrongly claim.
      # The release is out either way, so this step warns rather than fails.
      - name: record the changelog on main
        if: github.event_name == 'push'
        run: |
          if git diff --quiet -- CHANGELOG.md; then
            exit 0 # the tagged commit had its section already
          fi
          git fetch -q origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "::warning::main has moved past $TAG, so its CHANGELOG.md still lists $VERSION's entries under \"## Unreleased\". Move them under \"## $VERSION - $(date -u +%F)\" by hand."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(release): $VERSION" -- CHANGELOG.md
          if ! git push origin HEAD:main; then
            echo "::warning::Couldn't push the changelog rename to main. Run tools/release.sh prepare $VERSION on main and commit it."
          fi
